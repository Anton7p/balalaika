---
- name: Ensure OpenSSH server is installed
  ansible.builtin.package:
    name: openssh-server
    state: present

- name: Ensure UFW is installed
  ansible.builtin.package:
    name: ufw
    state: present

- name: Ensure .ssh directory exists for target user
  ansible.builtin.file:
    path: "/{{ 'root' if ssh_username == 'root' else 'home/' + ssh_username }}/.ssh"
    state: directory
    owner: "{{ ssh_username }}"
    group: "{{ ssh_username }}"
    mode: "0700"

- name: Install bootstrap public key for target user
  ansible.posix.authorized_key:
    user: "{{ ssh_username }}"
    key: "{{ ssh_public_key }}"
    state: present
