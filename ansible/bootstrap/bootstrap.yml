---
# Два этапа, один маркер на хост: {{ bootstrap_marker_path }}
# — Фаза 1 (hosts: all): BBR, Docker, SSH-ключ, hardening + UFW. На хостах из [nodes]
#   сразу пишется маркер (для них nginx не нужен). Повторный прогон пропускается.
# — Фаза 2 (hosts: master): nginx + certbot; после успеха — маркер на master.
# Master до конца фазы 2 без маркера, чтобы фаза 1 могла завершиться до TLS.

- name: "Bootstrap фаза 1: сеть (BBR), Docker, SSH"
  hosts: all
  become: true
  gather_facts: false
  vars:
    ssh_username: "{{ lookup('env', 'ANSIBLE_SSH_USERNAME') | default('root', true) }}"
    ssh_public_key: "{{ lookup('env', 'SSH_PUBLIC_KEY') }}"
    marker_slug: >-
      {{ (lookup('env', 'DOMAIN_NAME') | default('infra', true))
      | regex_replace('[^A-Za-z0-9._-]', '_') }}
    bootstrap_marker_path: "/etc/{{ marker_slug }}-bootstrap.done"
  pre_tasks:
    - name: Ensure Python is installed (for fresh hosts)
      ansible.builtin.raw: test -e /usr/bin/python3 || (apt-get update && apt-get install -y python3)
      changed_when: false

    - name: Gather facts after Python bootstrap
      ansible.builtin.setup:

    - name: Validate required public key exists
      ansible.builtin.assert:
        that:
          - ssh_public_key is string
          - ssh_public_key | length > 0
        fail_msg: "SSH_PUBLIC_KEY is required to bootstrap access."

    - name: Check whether bootstrap marker already exists on this host
      ansible.builtin.stat:
        path: "{{ bootstrap_marker_path }}"
      register: bootstrap_marker_stat

  tasks:
    - name: TCP BBR congestion control
      ansible.builtin.include_tasks: tasks/common/tcp-bbr.yml
      when: not bootstrap_marker_stat.stat.exists

    - name: Docker engine and DOCKER-USER rules
      ansible.builtin.include_tasks: tasks/common/docker.yml
      when: not bootstrap_marker_stat.stat.exists

    - name: SSH authorized key for admin access
      ansible.builtin.include_tasks: tasks/common/ssh-key.yml
      when: not bootstrap_marker_stat.stat.exists

    - name: SSH hardening and host firewall
      ansible.builtin.include_tasks: tasks/common/ssh-hardening.yml
      when: not bootstrap_marker_stat.stat.exists

    - name: Record bootstrap complete on node hosts (no TLS phase here)
      ansible.builtin.copy:
        dest: "{{ bootstrap_marker_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          bootstrap_completed=true
          phase=system
          completed_at={{ ansible_date_time.iso8601 }}
      when:
        - not bootstrap_marker_stat.stat.exists
        - (groups['nodes'] | default([])) | length > 0
        - inventory_hostname in (groups['nodes'] | default([]))

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted

- name: "Bootstrap фаза 2: nginx и TLS (только master)"
  hosts: master
  become: true
  gather_facts: true
  vars:
    domain_name: "{{ lookup('env', 'DOMAIN_NAME') }}"
    marker_slug: "{{ domain_name | regex_replace('[^A-Za-z0-9._-]', '_') }}"
    bootstrap_marker_path: "/etc/{{ marker_slug }}-bootstrap.done"
  pre_tasks:
    - name: Validate domain is set
      ansible.builtin.assert:
        that:
          - domain_name is string
          - domain_name | length > 0
        fail_msg: "DOMAIN_NAME is required for nginx/certbot on master."

    - name: Check whether bootstrap marker already exists on master
      ansible.builtin.stat:
        path: "{{ bootstrap_marker_path }}"
      register: master_bootstrap_marker

  tasks:
    - name: Nginx and Certbot on master
      ansible.builtin.include_tasks: tasks/master/nginx-certbot.yml
      when: not (master_bootstrap_marker.stat.exists | default(false))

    - name: Record bootstrap complete on master (system + TLS)
      ansible.builtin.copy:
        dest: "{{ bootstrap_marker_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          bootstrap_completed=true
          phase=full
          completed_at={{ ansible_date_time.iso8601 }}
      when: not (master_bootstrap_marker.stat.exists | default(false))
