---
# Деплой Telegram-бота (Docker Compose в /opt/infrastructure/app). Панель не трогаем.
- name: Deploy bot application on master
  hosts: master
  become: true
  gather_facts: true
  vars_files:
    - defaults/main.yml
  vars:
    deploy_root: "{{ lookup('env', 'DEPLOY_ROOT') | default('/opt/infrastructure', true) }}"
    app_dir: "{{ deploy_root }}/app"
    domain_name: "{{ lookup('env', 'DOMAIN_NAME') }}"
    vpn_admin_username: "{{ lookup('env', 'VPN_ADMIN_USERNAME') }}"
    vpn_admin_password: "{{ lookup('env', 'VPN_ADMIN_PASSWORD') }}"
    app_image: "{{ lookup('env', 'APP_IMAGE') }}"
    telegram_bot_token: "{{ lookup('env', 'TELEGRAM_BOT_TOKEN') }}"
    telegram_admin_id: "{{ lookup('env', 'TELEGRAM_ADMIN_ID') | default('', true) }}"
    encryption_key: "{{ lookup('env', 'ENCRYPTION_KEY') }}"
    app_db_password: "{{ lookup('env', 'APP_DB_PASSWORD') | default(vpn_admin_password, true) }}"
    vpn_working_inbound_ids: "{{ lookup('env', 'VPN_WORKING_INBOUND_IDS') | default(vpn_working_inbound_ids, true) }}"
    vpn_inbound_client_limit: "{{ lookup('env', 'VPN_INBOUND_CLIENT_LIMIT') | default(vpn_inbound_client_limit, true) }}"
    vpn_watchdog_enabled: "{{ lookup('env', 'VPN_WATCHDOG_ENABLED') | default(vpn_watchdog_enabled, true) }}"
    vpn_watchdog_interval_sec: "{{ lookup('env', 'VPN_WATCHDOG_INTERVAL_SEC') | default(vpn_watchdog_interval_sec, true) }}"
    vpn_watchdog_fail_threshold: "{{ lookup('env', 'VPN_WATCHDOG_FAIL_THRESHOLD') | default(vpn_watchdog_fail_threshold, true) }}"
    vpn_watchdog_nodes_json: "{{ lookup('env', 'VPN_WATCHDOG_NODES_JSON') | default(vpn_watchdog_nodes_json, true) }}"
    vpn_watchdog_hook_secret: "{{ lookup('env', 'VPN_WATCHDOG_HOOK_SECRET') | default(encryption_key, true) }}"
  pre_tasks:
    - name: Validate required bot deploy variables
      ansible.builtin.assert:
        that:
          - domain_name | length > 0
          - vpn_admin_username | length > 0
          - vpn_admin_password | length > 0
          - app_image | length > 0
          - telegram_bot_token | length > 0
          - encryption_key | length > 0
        fail_msg: >-
          Нужны DOMAIN_NAME, VPN_ADMIN_*, APP_IMAGE, TELEGRAM_BOT_TOKEN, ENCRYPTION_KEY;
          для pull с GHCR на сервере — в окружении control node GITHUB_ACTOR и GITHUB_TOKEN.
  tasks:
    - name: Include bot-only deploy tasks
      ansible.builtin.include_tasks: tasks/deploy/app-only.yml
