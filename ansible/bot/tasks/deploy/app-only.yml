---
# Bot stack only: templates + app pull + compose up + local health (no panel/nginx/certbot).

- name: Ensure app deploy directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ deploy_root }}"
    - "{{ app_dir }}"

- name: Deploy app stack compose file
  ansible.builtin.template:
    src: templates/app-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy app environment file
  ansible.builtin.template:
    src: templates/app.env.j2
    dest: "{{ app_dir }}/.env"
    mode: "0600"

- name: Log in to ghcr.io for private image pull
  ansible.builtin.shell: |
    set -euo pipefail
    printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
  args:
    executable: /bin/bash
  environment:
    GITHUB_TOKEN: "{{ lookup('env', 'GITHUB_TOKEN', default='') }}"
    GITHUB_ACTOR: "{{ lookup('env', 'GITHUB_ACTOR', default='') }}"
  when:
    - lookup('env', 'GITHUB_TOKEN', default='') | length > 0
    - lookup('env', 'GITHUB_ACTOR', default='') | length > 0
  no_log: true

- name: Pull latest bot app image
  ansible.builtin.command:
    cmd: docker compose pull app
    chdir: "{{ app_dir }}"

- name: Start/update bot application stack (recreate app/watchdog so .env changes apply)
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate app vpn-watchdog
    chdir: "{{ app_dir }}"
  register: app_up
  changed_when: "'Started' in app_up.stdout or 'Recreated' in app_up.stdout or 'Creating' in app_up.stdout"

- name: Verify NODE_IPS inside app container is valid JSON with addresses
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T app node -e
      "const v=process.env.NODE_IPS; if(!v) throw new Error('NODE_IPS empty');
      const p=JSON.parse(v); if(!Array.isArray(p)||!p.length) throw new Error('not array');
      if(!String(p[0].address||'').trim()) throw new Error('missing address');
      console.log('NODE_IPS ok:', p.length, 'nodes')"
    chdir: "{{ app_dir }}"
  register: node_ips_smoke
  changed_when: false

- name: Smoke check bot app health endpoint
  block:
    - name: Wait for /health (200 or 503 while dependencies start)
      ansible.builtin.uri:
        url: "http://127.0.0.1:3000/health"
        method: GET
        status_code: [200, 503]
        timeout: 15
      register: app_health
      retries: 12
      delay: 5
      until: app_health.status in [200, 503]

  rescue:
    - name: Collect docker compose logs after health failure
      ansible.builtin.command:
        cmd: docker compose logs --tail 200
        chdir: "{{ app_dir }}"
      register: compose_logs
      changed_when: false

    - name: Fail with compose log excerpt
      ansible.builtin.fail:
        msg: >-
          Bot /health did not become ready in time.
          {{ compose_logs.stdout | default('', true) }}
