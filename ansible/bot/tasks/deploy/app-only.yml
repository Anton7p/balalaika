---
# Bot stack: rsync исходников → docker compose build → up (без GHCR pull).

- name: Ensure rsync is installed on master
  ansible.builtin.apt:
    name: rsync
    state: present
    update_cache: true

- name: Ensure app deploy directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ deploy_root }}"
    - "{{ app_dir }}"
    - "{{ app_dir }}/src"

- name: Sync application source for Docker build
  ansible.posix.synchronize:
    src: "{{ deploy_source_dir }}/"
    dest: "{{ app_dir }}/src/"
    delete: true
    recursive: true
    rsync_opts:
      - "--exclude=node_modules"
      - "--exclude=dist"
      - "--exclude=.git"
      - "--exclude=.env"
      - "--exclude=.env.*"
      - "--exclude=ansible/inventory.ini"
      - "--exclude=ansible/.tmp-keys"
      - "--exclude=.github"
      - "--exclude=ansible"

- name: Deploy app stack compose file
  ansible.builtin.template:
    src: templates/app-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy app environment file
  ansible.builtin.template:
    src: templates/app.env.j2
    dest: "{{ app_dir }}/.env"
    mode: "0600"

- name: Build bot app image on master
  ansible.builtin.command:
    cmd: docker compose build app
    chdir: "{{ app_dir }}"

- name: Start/update bot application stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ app_dir }}"
  register: app_up
  changed_when: "'Started' in app_up.stdout or 'Recreated' in app_up.stdout or 'Creating' in app_up.stdout"

- name: Smoke check bot app health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/health"
    method: GET
    status_code: [200, 503]
    timeout: 15
  register: app_health
  retries: 12
  delay: 5
  until: app_health.status in [200, 503]
