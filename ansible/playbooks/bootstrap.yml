---
- name: Bootstrap all infrastructure hosts
  hosts: all
  become: true
  gather_facts: false
  vars:
    ssh_username: "{{ lookup('env', 'ANSIBLE_SSH_USERNAME') | default('root', true) }}"
    ssh_public_key: "{{ lookup('env', 'SSH_PUBLIC_KEY') }}"
    marker_slug: >-
      {{ (lookup('env', 'DOMAIN_NAME') | default('infra', true))
      | regex_replace('[^A-Za-z0-9._-]', '_') }}
    bootstrap_marker_path: "/etc/{{ marker_slug }}-bootstrap.done"
  pre_tasks:
    - name: Ensure Python is installed (for fresh hosts)
      raw: test -e /usr/bin/python3 || (apt-get update && apt-get install -y python3)
      changed_when: false

    - name: Gather facts after Python bootstrap
      ansible.builtin.setup:

    - name: Validate required public key exists
      ansible.builtin.assert:
        that:
          - ssh_public_key is string
          - ssh_public_key | length > 0
        fail_msg: "SSH_PUBLIC_KEY is required to bootstrap access."

    - name: Check whether bootstrap marker already exists
      ansible.builtin.stat:
        path: "{{ bootstrap_marker_path }}"
      register: bootstrap_marker

    - name: Set bootstrap state fact
      ansible.builtin.set_fact:
        bootstrap_already_done: "{{ bootstrap_marker.stat.exists | default(false) }}"

  tasks:
    - name: TCP BBR Congestion Control - Common for both master and node
      ansible.builtin.include_tasks: tasks/common/10-tcp-bbr.yml
      when: not bootstrap_already_done

    - name: Docker Setup - Common for both master and node
      ansible.builtin.include_tasks: tasks/common/20-docker.yml
      when: not bootstrap_already_done

    - name: SSH Key Setup - Common for both master and node
      ansible.builtin.include_tasks: tasks/common/30-ssh-key.yml
      when: not bootstrap_already_done

    - name: SSH Hardening - Common for both master and node
      ansible.builtin.include_tasks: tasks/common/40-ssh-hardening.yml
      when: not bootstrap_already_done

    - name: Create bootstrap completion marker
      ansible.builtin.copy:
        dest: "{{ bootstrap_marker_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          bootstrap_completed=true
          completed_at={{ ansible_date_time.iso8601 }}
      when:
        - not bootstrap_already_done
        - inventory_hostname not in groups['master']

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted

- name: Configure master edge services
  hosts: master
  become: true
  gather_facts: true
  vars:
    domain_name: "{{ lookup('env', 'DOMAIN_NAME') }}"
    marker_slug: "{{ domain_name | regex_replace('[^A-Za-z0-9._-]', '_') }}"
    bootstrap_marker_path: "/etc/{{ marker_slug }}-bootstrap.done"
  pre_tasks:
    - name: Validate domain is set
      ansible.builtin.assert:
        that:
          - domain_name is string
          - domain_name | length > 0
        fail_msg: "DOMAIN_NAME is required for master bootstrap."

    - name: Check whether bootstrap marker already exists on master
      ansible.builtin.stat:
        path: "{{ bootstrap_marker_path }}"
      register: master_bootstrap_marker
  tasks:
    - name: Nginx and Certbot setup on master
      ansible.builtin.include_tasks: tasks/master/10-nginx-certbot.yml
      when: not (master_bootstrap_marker.stat.exists | default(false))

    - name: Create bootstrap completion marker on master
      ansible.builtin.copy:
        dest: "{{ bootstrap_marker_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          bootstrap_completed=true
          completed_at={{ ansible_date_time.iso8601 }}
      when: not (master_bootstrap_marker.stat.exists | default(false))
