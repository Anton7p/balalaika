---
- name: Deploy 3x-ui panel on master
  hosts: master
  become: true
  gather_facts: true
  vars_files:
    - vars/three-x-ui.defaults.yml
  vars:
    deploy_root: "{{ lookup('env', 'DEPLOY_ROOT') | default('/opt/infrastructure', true) }}"
    panel_dir: "{{ deploy_root }}/panel"
    app_dir: "{{ deploy_root }}/app"
    certbot_webroot: /var/www/certbot
    domain_name: "{{ lookup('env', 'DOMAIN_NAME') }}"
    vpn_admin_username: "{{ lookup('env', 'VPN_ADMIN_USERNAME') }}"
    vpn_admin_password: "{{ lookup('env', 'VPN_ADMIN_PASSWORD') }}"
    three_x_ui_image: "{{ lookup('env', 'THREE_X_UI_IMAGE') | default(three_x_ui_image_default, true) }}"
    three_x_ui_web_base_path: "{{ lookup('env', 'THREE_X_UI_WEB_BASE_PATH') | default(three_x_ui_web_base_path_default, true) }}"
    three_x_ui_panel_port: "{{ lookup('env', 'THREE_X_UI_PANEL_PORT') | default('2053', true) }}"
    three_x_ui_sub_port: "{{ lookup('env', 'THREE_X_UI_SUB_PORT') | default('2096', true) }}"
    three_x_ui_inbound_id: "{{ lookup('env', 'THREE_X_UI_INBOUND_ID') | default('', true) }}"
    three_x_ui_reality_private_key_override: "{{ lookup('env', 'THREE_X_UI_REALITY_PRIVATE_KEY') | default('', true) }}"
    three_x_ui_reality_public_key_override: "{{ lookup('env', 'THREE_X_UI_REALITY_PUBLIC_KEY') | default('', true) }}"
    three_x_ui_vpn_port: "{{ lookup('env', 'THREE_X_UI_VPN_PORT') | default('8443', true) }}"
    three_x_ui_managed_inbound_remark: "{{ lookup('env', 'THREE_X_UI_MANAGED_INBOUND_REMARK') | default('balalaika-bot', true) }}"
    app_image: "{{ lookup('env', 'APP_IMAGE') }}"
    ghcr_username: "{{ lookup('env', 'GHCR_USERNAME') }}"
    ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') }}"
    telegram_bot_token: "{{ lookup('env', 'TELEGRAM_BOT_TOKEN') }}"
    telegram_bot_admin: "{{ lookup('env', 'TELEGRAM_BOT_ADMIN') | default('', true) }}"
    telegram_admin_chat_id: "{{ lookup('env', 'TELEGRAM_ID_ADMIN') | default('', true) }}"
    encryption_key: "{{ lookup('env', 'ENCRYPTION_KEY') }}"
    app_db_password: "{{ lookup('env', 'APP_DB_PASSWORD') | default(vpn_admin_password, true) }}"
  pre_tasks:
    - name: Validate required deployment variables
      ansible.builtin.assert:
        that:
          - domain_name | length > 0
          - vpn_admin_username | length > 0
          - vpn_admin_password | length > 0
          - three_x_ui_image | length > 0
          - three_x_ui_web_base_path | length > 0
          - three_x_ui_panel_port | length > 0
          - three_x_ui_sub_port | length > 0
          - app_image | length > 0
          - ghcr_username | length > 0
          - ghcr_token | length > 0
          - telegram_bot_token | length > 0
          - encryption_key | length > 0
          - >
            (three_x_ui_inbound_id | length == 0)
            or (three_x_ui_inbound_id is match('^[0-9]+$'))
        fail_msg: >-
          Required vars missing, or THREE_X_UI_INBOUND_ID is set but is not a positive integer string.
  tasks:
    - name: Include master deploy tasks
      ansible.builtin.include_tasks: tasks/deploy/master.yml
  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
