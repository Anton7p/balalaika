---
# GHCR tag — semver панели, не строка Xray в UI. v2.9.3 включает Xray v26.4.25 (upstream release notes).
# Перекрыть можно секретом THREE_X_UI_IMAGE в CI.
three_x_ui_image_default: "ghcr.io/mhsanaei/3x-ui:v2.9.3"

three_x_ui_web_base_path_default: "/panel/"

three_x_ui_managed_inbound_remark: "balalaika-bot"
three_x_ui_vpn_listen: ""

three_x_ui_reality_dest: "www.cloudflare.com:443"
three_x_ui_reality_server_names:
  - "www.cloudflare.com"
three_x_ui_reality_fingerprint: "chrome"

three_x_ui_vless_settings:
  clients: []
  decryption: "none"
  encryption: "none"

three_x_ui_sniffing:
  enabled: true
  destOverride: ["http", "tls", "quic", "fakedns"]
  metadataOnly: false
  routeOnly: false
