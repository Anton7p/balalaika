---
# Docker image tag for 3x-ui panel.
# Перекрыть можно секретом THREE_X_UI_IMAGE в CI.
three_x_ui_image_default: "hsanaeii/3x-ui:v2.9.4"
xui_container_name_default: "3x-ui"
deploy_root_default: "/opt/infrastructure"
certbot_webroot_default: "/var/www/certbot"
loopback_host_default: "127.0.0.1"
app_port_default: "3000"
app_health_path_default: "/health"
outbound_test_url_default: "https://www.google.com/generate_204"

three_x_ui_web_base_path_default: "/panel/"

three_x_ui_managed_inbound_remark: "panel"
three_x_ui_vpn_listen: ""

three_x_ui_reality_dest: "www.cloudflare.com:443"
three_x_ui_reality_server_names:
  - "www.cloudflare.com"
three_x_ui_reality_fingerprint: "chrome"

three_x_ui_vless_settings:
  clients: []
  decryption: "none"
  encryption: "none"

three_x_ui_sniffing:
  enabled: true
  destOverride: ["http", "tls", "quic", "fakedns"]
  metadataOnly: false
  routeOnly: false
