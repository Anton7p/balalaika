---
# Build ansible/inventory.ini on the CI runner from env vars (GitHub Actions secrets).
# No shell/Python helpers — only Ansible + Jinja.
#
# Env:
#   SERVER_IP — plain host/IP or JSON {"address","password"}
#   INVENTORY_MODE — master | cluster (default master)
#   INFRASTRUCTURE_IP_LIST — JSON array (cluster only)
#   REQUIRE_NONEMPTY_NODES — 1 to require non-empty array (deploy-infra)
#   OUTPUT_PATH — optional absolute path; default ansible/inventory.ini next to playbooks/

- name: Materialize inventory.ini for CI
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ci_inventory_mode: "{{ lookup('env', 'INVENTORY_MODE', default='master') | trim | lower }}"
    ci_require_nonempty_nodes: "{{ lookup('env', 'REQUIRE_NONEMPTY_NODES', default='0') }}"
    ci_inventory_dest: >-
      {{ (lookup('env', 'OUTPUT_PATH', default='') | trim | length > 0)
         | ternary(lookup('env', 'OUTPUT_PATH') | trim,
                   playbook_dir | dirname ~ '/inventory.ini') }}

  tasks:
    - name: Validate INVENTORY_MODE
      ansible.builtin.assert:
        that:
          - ci_inventory_mode in ['master', 'cluster']
        fail_msg: INVENTORY_MODE must be master or cluster

    - name: Read SERVER_IP from environment
      ansible.builtin.set_fact:
        _ci_server_raw: "{{ lookup('env', 'SERVER_IP', default='') | trim }}"

    - name: Require SERVER_IP
      ansible.builtin.assert:
        that:
          - _ci_server_raw | length > 0
        fail_msg: SERVER_IP is empty

    - name: Parse SERVER_IP as JSON object
      when: _ci_server_raw.startswith('{')
      ansible.builtin.set_fact:
        _ci_json: "{{ _ci_server_raw | from_json }}"

    - name: Extract address/password from JSON SERVER_IP
      when: _ci_server_raw.startswith('{')
      ansible.builtin.set_fact:
        _ci_host_candidate: "{{ _ci_json.address | default('', true) | trim }}"
        _ci_master_password: "{{ _ci_json.password | default('', true) | trim }}"

    - name: Use plain SERVER_IP
      when: not _ci_server_raw.startswith('{')
      ansible.builtin.set_fact:
        _ci_host_candidate: "{{ _ci_server_raw }}"
        _ci_master_password: ''

    - name: Normalize host candidate (scheme, quotes)
      ansible.builtin.set_fact:
        _n: >-
          {{ _ci_host_candidate | regex_replace('^(?i)https?://', '')
          | regex_replace('[\"\']', '') | trim }}

    - name: Strip leading/trailing slashes from host candidate
      ansible.builtin.set_fact:
        _n: >-
          {{
            _n
            | regex_replace('^/+', '')
            | regex_replace('/+$', '')
            | trim
          }}

    - name: Drop trailing port if present
      ansible.builtin.set_fact:
        _n: "{{ (_n.split(':') | first) | trim }}"

    - name: Resolve parseable master host (hostname, IPv4, or first token)
      ansible.builtin.set_fact:
        ci_master_host: >-
          {% if _n is match('^[A-Za-z0-9._-]+$') %}
          {{ _n }}
          {% elif _n | regex_search('(?:[0-9]{1,3}\.){3}[0-9]{1,3}') %}
          {{ _n | regex_search('(?:[0-9]{1,3}\.){3}[0-9]{1,3}') }}
          {% else %}
          {{ _n | regex_search('[A-Za-z0-9._-]+') | default('', true) }}
          {% endif %}

    - name: Validate resolved SERVER_IP
      ansible.builtin.assert:
        that:
          - ci_master_host | length > 0
          - ci_master_host is match('^[A-Za-z0-9._-]+$')
        fail_msg: SERVER_IP is not parseable

    - name: Alias master password for template
      ansible.builtin.set_fact:
        ci_master_password: "{{ _ci_master_password | default('') }}"

    - name: Load INFRASTRUCTURE_IP_LIST for cluster mode
      when: ci_inventory_mode == 'cluster'
      ansible.builtin.set_fact:
        _infra_raw: "{{ lookup('env', 'INFRASTRUCTURE_IP_LIST', default='') | trim }}"

    - name: Require INFRASTRUCTURE_IP_LIST for cluster mode
      when: ci_inventory_mode == 'cluster'
      ansible.builtin.assert:
        that:
          - _infra_raw | length > 0
        fail_msg: INFRASTRUCTURE_IP_LIST is empty

    - name: Parse INFRASTRUCTURE_IP_LIST JSON
      when: ci_inventory_mode == 'cluster'
      ansible.builtin.set_fact:
        ci_hosts_list: "{{ _infra_raw | from_json }}"

    - name: Require JSON array for INFRASTRUCTURE_IP_LIST
      when: ci_inventory_mode == 'cluster'
      ansible.builtin.assert:
        that:
          - ci_hosts_list | type_debug == 'list'
        fail_msg: Failed to parse INFRASTRUCTURE_IP_LIST as JSON array

    - name: Require non-empty node list when enforced
      when:
        - ci_inventory_mode == 'cluster'
        - ci_require_nonempty_nodes == '1'
      ansible.builtin.assert:
        that:
          - ci_hosts_list | length > 0
        fail_msg: INFRASTRUCTURE_IP_LIST must be a non-empty JSON array

    - name: Ensure ci_hosts_list exists for template (master mode)
      when: ci_inventory_mode != 'cluster'
      ansible.builtin.set_fact:
        ci_hosts_list: []

    - name: Write inventory.ini
      ansible.builtin.template:
        src: inventory.ci.ini.j2
        dest: "{{ ci_inventory_dest }}"
        mode: "0644"
