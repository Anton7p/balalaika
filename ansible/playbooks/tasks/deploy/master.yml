---
- name: Ensure panel directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ deploy_root }}"
    - "{{ panel_dir }}"
    - "{{ app_dir }}"
    - "{{ certbot_webroot }}"

- name: Deploy Marzban panel compose file
  ansible.builtin.template:
    src: templates/marzban-master-compose.yml.j2
    dest: "{{ panel_dir }}/docker-compose.yml"
    mode: "0644"

- name: Start/update Marzban panel stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ panel_dir }}"
  register: panel_up
  changed_when: "'Started' in panel_up.stdout or 'Recreated' in panel_up.stdout or 'Creating' in panel_up.stdout"

- name: Deploy app stack compose file
  ansible.builtin.template:
    src: templates/app-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy app environment file
  ansible.builtin.template:
    src: templates/app.env.j2
    dest: "{{ app_dir }}/.env"
    mode: "0600"

- name: Log in to GHCR on master host
  ansible.builtin.shell: |
    set -e
    echo "{{ ghcr_token }}" | docker login ghcr.io -u "{{ ghcr_username }}" --password-stdin
  no_log: true

- name: Pull latest bot app image
  ansible.builtin.command:
    cmd: docker compose pull app
    chdir: "{{ app_dir }}"

- name: Start/update bot application stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ app_dir }}"
  register: app_up
  changed_when: "'Started' in app_up.stdout or 'Recreated' in app_up.stdout or 'Creating' in app_up.stdout"

- name: Wait for Marzban API to answer
  ansible.builtin.uri:
    url: "{{ marzban_api_url }}/admin/token"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ vpn_admin_username }}"
      password: "{{ vpn_admin_password }}"
    status_code: [200, 401, 403]
    timeout: 10
  register: auth_probe
  retries: 20
  delay: 5
  until: auth_probe.status in [200, 401, 403]
  no_log: true

- name: Create first Marzban admin when needed
  ansible.builtin.uri:
    url: "{{ marzban_api_url }}/admin"
    method: POST
    body_format: json
    body:
      username: "{{ vpn_admin_username }}"
      password: "{{ vpn_admin_password }}"
      is_sudo: true
    status_code: [200, 201, 403]
    timeout: 15
  when: auth_probe.status == 401
  no_log: true

- name: Authenticate to Marzban API
  ansible.builtin.uri:
    url: "{{ marzban_api_url }}/admin/token"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ vpn_admin_username }}"
      password: "{{ vpn_admin_password }}"
    status_code: 200
    timeout: 15
  register: master_auth
  retries: 5
  delay: 3
  until: master_auth.status == 200
  no_log: true

- name: Read current Marzban core config
  ansible.builtin.uri:
    url: "{{ marzban_api_url }}/core/config"
    method: GET
    headers:
      Authorization: "Bearer {{ master_auth.json.access_token }}"
    status_code: 200
    return_content: true
    timeout: 30
  register: core_config
  no_log: true

- name: Check whether required inbound already exists
  ansible.builtin.set_fact:
    marzban_inbound_exists: >-
      {{ core_config.json is defined and
         core_config.json.inbounds is defined and
         (core_config.json.inbounds | selectattr('tag', 'equalto', marzban_inbound_tag) | list | length > 0) }}

- name: Generate Reality private/public keypair when inbound missing
  ansible.builtin.command:
    cmd: docker run --rm {{ marzban_node_image }} xray x25519
  register: x25519_output
  when: not marzban_inbound_exists
  changed_when: true
  no_log: true

- name: Parse generated Reality keys
  ansible.builtin.set_fact:
    reality_private_key: "{{ x25519_output.stdout | regex_search('Private key: ([^\\s]+)', '\\1') | first }}"
    reality_public_key: "{{ x25519_output.stdout | regex_search('Public key: ([^\\s]+)', '\\1') | first }}"
  when: not marzban_inbound_exists
  no_log: true

- name: Generate short id for Reality inbound
  ansible.builtin.command:
    cmd: openssl rand -hex 4
  register: short_id_output
  when: not marzban_inbound_exists
  changed_when: true
  no_log: true

- name: Save generated Reality short id
  ansible.builtin.set_fact:
    reality_short_id: "{{ short_id_output.stdout }}"
  when: not marzban_inbound_exists
  no_log: true

- name: Build Reality inbound spec
  ansible.builtin.set_fact:
    reality_inbound_spec:
      tag: "{{ marzban_inbound_tag }}"
      listen: "0.0.0.0"
      port: 50443
      protocol: "vless"
      settings:
        clients: []
        decryption: "none"
      streamSettings:
        network: "tcp"
        tcpSettings: {}
        security: "reality"
        realitySettings:
          show: false
          dest: "{{ marzban_reality_dest }}"
          xver: 0
          serverNames: "{{ marzban_reality_server_names_csv.split(',') | map('trim') | reject('equalto', '') | list }}"
          privateKey: "{{ reality_private_key }}"
          spiderX: "/"
          shortIds:
            - "{{ reality_short_id }}"
      sniffing:
        enabled: true
        destOverride:
          - "http"
          - "tls"
          - "quic"
  when: not marzban_inbound_exists
  no_log: true

- name: Build updated core config with Reality inbound
  ansible.builtin.set_fact:
    updated_core_config: "{{ core_config.json | combine({'inbounds': (core_config.json.inbounds | default([])) + [reality_inbound_spec]}, recursive=True) }}"
  when: not marzban_inbound_exists
  no_log: true

- name: Apply updated core config in Marzban
  ansible.builtin.uri:
    url: "{{ marzban_api_url }}/core/config"
    method: PUT
    headers:
      Authorization: "Bearer {{ master_auth.json.access_token }}"
      Content-Type: application/json
    body_format: json
    body: "{{ updated_core_config }}"
    status_code: [200, 201, 204]
    timeout: 30
  when: not marzban_inbound_exists

- name: Fetch node certificate from Marzban
  ansible.builtin.uri:
    url: "{{ marzban_api_url }}/node/settings"
    method: GET
    headers:
      Authorization: "Bearer {{ master_auth.json.access_token }}"
    status_code: 200
    return_content: true
    timeout: 30
  register: node_settings
  no_log: true

- name: Validate node certificate exists
  ansible.builtin.assert:
    that:
      - node_settings.json.certificate is defined
      - node_settings.json.certificate | length > 0
    fail_msg: "Marzban API did not return node certificate from /node/settings."

- name: Save node certificate as host fact
  ansible.builtin.set_fact:
    marzban_node_certificate: "{{ node_settings.json.certificate }}"
    cacheable: true
  no_log: true

- name: Fetch existing registered nodes
  ansible.builtin.uri:
    url: "{{ marzban_api_url }}/nodes"
    method: GET
    headers:
      Authorization: "Bearer {{ master_auth.json.access_token }}"
    status_code: 200
    return_content: true
    timeout: 20
  register: existing_nodes
  no_log: true

- name: Register missing infrastructure nodes in Marzban
  ansible.builtin.uri:
    url: "{{ marzban_api_url }}/node"
    method: POST
    headers:
      Authorization: "Bearer {{ master_auth.json.access_token }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "{{ item | replace('.', '-') }}"
      address: "{{ hostvars[item].ansible_host | default(item) }}"
      port: 62050
      api_prefix: "{{ (hostvars[item].ansible_host | default(item)) | hash('sha1') | regex_replace('^(.{8}).*$', '\\1') }}"
      certificate: "{{ marzban_node_certificate }}"
    status_code: [200, 201, 409]
    timeout: 30
  loop: "{{ groups['nodes'] | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when: >
    groups['nodes'] is defined and
    (
      existing_nodes.json | selectattr('address', 'equalto', (hostvars[item].ansible_host | default(item))) | list | length
    ) == 0
  no_log: true

- name: Check SSL certificate presence
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
  register: ssl_cert_stat

- name: Deploy nginx config for subscriptions
  ansible.builtin.template:
    src: templates/nginx-subscription.conf.j2
    dest: /etc/nginx/sites-available/marzban-subscription.conf
    mode: "0644"
  vars:
    ssl_cert_exists: "{{ ssl_cert_stat.stat.exists | default(false) }}"

- name: Enable nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/marzban-subscription.conf
    dest: /etc/nginx/sites-enabled/marzban-subscription.conf
    state: link
  notify: Reload nginx

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Validate nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Flush nginx handlers
  ansible.builtin.meta: flush_handlers

- name: Ensure certbot certificate for domain
  ansible.builtin.command:
    cmd: >-
      certbot certonly --webroot
      -w {{ certbot_webroot }}
      -d {{ domain_name }}
      --non-interactive
      --agree-tos
      --register-unsafely-without-email
  register: certbot_issue
  changed_when: "'Congratulations' in certbot_issue.stdout"
  failed_when: certbot_issue.rc != 0 and ('not yet due for renewal' not in certbot_issue.stdout)

- name: Recheck SSL certificate presence
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
  register: ssl_cert_stat_after

- name: Redeploy nginx config with SSL enabled
  ansible.builtin.template:
    src: templates/nginx-subscription.conf.j2
    dest: /etc/nginx/sites-available/marzban-subscription.conf
    mode: "0644"
  vars:
    ssl_cert_exists: "{{ ssl_cert_stat_after.stat.exists | default(false) }}"
  notify: Reload nginx

- name: Flush nginx handlers after SSL update
  ansible.builtin.meta: flush_handlers

- name: Ensure marzban inbound tag fact exists
  ansible.builtin.set_fact:
    marzban_inbound_tag_effective: "{{ marzban_inbound_tag }}"
    cacheable: true

- name: Smoke check public health endpoint
  ansible.builtin.uri:
    url: "https://{{ domain_name }}/health"
    method: GET
    status_code: 200
    timeout: 15
  register: public_health
  retries: 5
  delay: 3
  until: public_health.status == 200

- name: Smoke check bot app health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/health"
    method: GET
    status_code: [200, 503]
    timeout: 15
  register: app_health
  retries: 10
  delay: 3
  until: app_health.status in [200, 503]

