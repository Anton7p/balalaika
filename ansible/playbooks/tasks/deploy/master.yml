---
- name: Ensure panel directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ deploy_root }}"
    - "{{ panel_dir }}"
    - "{{ app_dir }}"
    - "{{ certbot_webroot }}"

- name: Ensure 3x-ui panel, subscription, and VPN data port in UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "{{ three_x_ui_panel_port }}"
    - "{{ three_x_ui_sub_port }}"
    - "{{ three_x_ui_vpn_port }}"

- name: Deploy 3x-ui panel compose file
  ansible.builtin.template:
    src: templates/three-x-ui-master-compose.yml.j2
    dest: "{{ panel_dir }}/docker-compose.yml"
    mode: "0644"

- name: Pull latest 3x-ui panel image
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ panel_dir }}"

- name: Start/update 3x-ui panel stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ panel_dir }}"
  register: panel_up
  changed_when: "'Started' in panel_up.stdout or 'Recreated' in panel_up.stdout or 'Creating' in panel_up.stdout"

- name: Wait for 3x-ui web listener
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ three_x_ui_panel_port | int }}"
    timeout: 180

- name: Sync 3x-ui credentials and web base path
  ansible.builtin.command:
    cmd: >-
      docker exec 3x-ui x-ui setting -username "{{ vpn_admin_username }}"
      -password "{{ vpn_admin_password }}"
      -webBasePath "{{ three_x_ui_web_base_path }}"
  register: xui_setting
  retries: 8
  delay: 5
  until: xui_setting.rc == 0
  changed_when: xui_setting.rc == 0
  no_log: true

- name: Auto-create or resolve managed VPN inbound via 3x-ui API
  ansible.builtin.include_tasks: three-x-ui-inbound.yml
  when: three_x_ui_manage_inbound | bool

- name: Use manual THREE_X_UI_INBOUND_ID when automation is disabled
  ansible.builtin.set_fact:
    three_x_ui_inbound_for_app: "{{ three_x_ui_inbound_id }}"
  when: not (three_x_ui_manage_inbound | bool)

- name: Inbound id must be resolved for the bot
  ansible.builtin.assert:
    that:
      - three_x_ui_inbound_for_app is defined
      - three_x_ui_inbound_for_app | string | length > 0

- name: Deploy app stack compose file
  ansible.builtin.template:
    src: templates/app-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy app environment file
  ansible.builtin.template:
    src: templates/app.env.j2
    dest: "{{ app_dir }}/.env"
    mode: "0600"

- name: Log in to GHCR on master host
  ansible.builtin.shell: |
    set -e
    echo "{{ ghcr_token }}" | docker login ghcr.io -u "{{ ghcr_username }}" --password-stdin
  no_log: true

- name: Pull latest bot app image
  ansible.builtin.command:
    cmd: docker compose pull app
    chdir: "{{ app_dir }}"

- name: Start/update bot application stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ app_dir }}"
  register: app_up
  changed_when: "'Started' in app_up.stdout or 'Recreated' in app_up.stdout or 'Creating' in app_up.stdout"

- name: Check SSL certificate presence
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
  register: ssl_cert_stat

- name: Remove legacy nginx site files from older deploys
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/marzban-subscription.conf
    - /etc/nginx/sites-available/marzban-subscription.conf
  notify: Reload nginx

- name: Deploy nginx config for panel and subscriptions
  ansible.builtin.template:
    src: templates/nginx-subscription.conf.j2
    dest: /etc/nginx/sites-available/infra-edge.conf
    mode: "0644"
  vars:
    ssl_cert_exists: "{{ ssl_cert_stat.stat.exists | default(false) }}"

- name: Enable nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/infra-edge.conf
    dest: /etc/nginx/sites-enabled/infra-edge.conf
    state: link
  notify: Reload nginx

- name: Remove legacy subscription nginx site symlink
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/subscription.conf
    state: absent
  notify: Reload nginx

- name: Remove legacy subscription nginx site file
  ansible.builtin.file:
    path: /etc/nginx/sites-available/subscription.conf
    state: absent
  notify: Reload nginx

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Validate nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Flush nginx handlers
  ansible.builtin.meta: flush_handlers

- name: Ensure certbot certificate for domain
  ansible.builtin.command:
    cmd: >-
      certbot certonly --webroot
      -w {{ certbot_webroot }}
      -d {{ domain_name }}
      --non-interactive
      --agree-tos
      --register-unsafely-without-email
  register: certbot_issue
  changed_when: "'Congratulations' in certbot_issue.stdout"
  failed_when: certbot_issue.rc != 0 and ('not yet due for renewal' not in certbot_issue.stdout)

- name: Recheck SSL certificate presence
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
  register: ssl_cert_stat_after

- name: Redeploy nginx config with SSL enabled
  ansible.builtin.template:
    src: templates/nginx-subscription.conf.j2
    dest: /etc/nginx/sites-available/infra-edge.conf
    mode: "0644"
  vars:
    ssl_cert_exists: "{{ ssl_cert_stat_after.stat.exists | default(false) }}"
  notify: Reload nginx

- name: Flush nginx handlers after SSL update
  ansible.builtin.meta: flush_handlers

- name: Smoke check public health endpoint
  ansible.builtin.uri:
    url: "https://{{ domain_name }}/health"
    method: GET
    status_code: 200
    timeout: 15
  register: public_health
  retries: 5
  delay: 3
  until: public_health.status == 200

- name: Smoke check bot app health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/health"
    method: GET
    status_code: [200, 503]
    timeout: 15
  register: app_health
  retries: 10
  delay: 3
  until: app_health.status in [200, 503]
