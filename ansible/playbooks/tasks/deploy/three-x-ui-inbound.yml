---
# Idempotent VLESS+REALITY inbound for the Telegram bot; sets three_x_ui_inbound_for_app.

- name: Assert Reality env overrides are paired
  ansible.builtin.assert:
    that:
      - >
        (three_x_ui_reality_private_key_override | length > 0)
        == (three_x_ui_reality_public_key_override | length > 0)
    fail_msg: >-
      Set both THREE_X_UI_REALITY_PRIVATE_KEY and THREE_X_UI_REALITY_PUBLIC_KEY in CI,
      or leave both empty to auto-generate on the server.

- name: Reality — apply keypair from secrets
  ansible.builtin.set_fact:
    three_x_ui_reality_private_key: "{{ three_x_ui_reality_private_key_override }}"
    three_x_ui_reality_public_key: "{{ three_x_ui_reality_public_key_override }}"
  when:
    - three_x_ui_reality_private_key_override | length > 0
    - three_x_ui_reality_public_key_override | length > 0

- name: Stat persisted Reality keypair on panel volume
  ansible.builtin.stat:
    path: "{{ panel_dir }}/data/.balalaika-reality.json"
  register: reality_stat

- name: Reality — load persisted keypair JSON
  ansible.builtin.slurp:
    src: "{{ panel_dir }}/data/.balalaika-reality.json"
  register: reality_slurp
  when:
    - three_x_ui_reality_private_key is not defined
    - reality_stat.stat.exists

- name: Reality — set keys from persisted JSON
  ansible.builtin.set_fact:
    three_x_ui_reality_private_key: "{{ _rk.privateKey }}"
    three_x_ui_reality_public_key: "{{ _rk.publicKey }}"
  vars:
    _rk: "{{ reality_slurp.content | b64decode | from_json }}"
  when:
    - three_x_ui_reality_private_key is not defined
    - reality_stat.stat.exists

- name: Reality — locate Xray binary inside 3x-ui container
  ansible.builtin.shell: |
    docker exec 3x-ui sh -c '
      for p in \
        /app/bin/xray-linux-amd64 \
        /app/bin/xray-linux-arm64 \
        /app/bin/xray-linux-arm32 \
        /app/bin/xray-linux-armv6 \
        /app/bin/xray; do
        if [ -x "$p" ]; then echo "$p"; exit 0; fi
      done
      f=$(find /app -maxdepth 8 -type f \( -name "xray-linux-*" -o -name xray \) -perm -111 2>/dev/null | head -n1)
      if [ -n "$f" ]; then echo "$f"; exit 0; fi
      exit 1
    '
  args:
    executable: /bin/bash
  register: three_x_ui_xray_bin
  changed_when: false
  failed_when: >
    (three_x_ui_xray_bin.rc | default(1) != 0) or
    ((three_x_ui_xray_bin.stdout | default('') | trim) | length == 0)
  when: three_x_ui_reality_private_key is not defined

- name: Reality — generate keypair via located Xray binary
  ansible.builtin.shell: |
    set -euo pipefail
    XRAY_X25519_OUT="$(docker exec 3x-ui "{{ three_x_ui_xray_bin.stdout | trim }}" x25519 2>&1)"
    export XRAY_X25519_OUT
    python3 <<'PY'
    import json
    import os
    import re
    import sys

    text = os.environ.get("XRAY_X25519_OUT", "")

    def grab(pat: str) -> str:
        m = re.search(pat, text)
        return m.group(1).strip() if m else ""

    priv = grab(r"PrivateKey:\s*(\S+)")
    pub = (
        grab(r"PublicKey:\s*(\S+)")
        or grab(r"Password\s*\(PublicKey\):\s*(\S+)")
        or grab(r"Password:\s*(\S+)")
    )
    if not priv or not pub:
        sys.stderr.write(
            "x25519: could not parse PrivateKey/PublicKey from:\\n" + repr(text[:500])
        )
        sys.exit(1)
    print(json.dumps({"privateKey": priv, "publicKey": pub}))
    PY
  args:
    executable: /bin/bash
  register: reality_gen
  changed_when: true
  when: three_x_ui_reality_private_key is not defined

- name: Reality — persist generated keypair on panel volume
  ansible.builtin.copy:
    dest: "{{ panel_dir }}/data/.balalaika-reality.json"
    content: "{{ reality_gen.stdout | trim }}\n"
    mode: "0600"
  when: three_x_ui_reality_private_key is not defined

- name: Reality — materialize generated keys as facts
  ansible.builtin.set_fact:
    three_x_ui_reality_private_key: "{{ _rk2.privateKey }}"
    three_x_ui_reality_public_key: "{{ _rk2.publicKey }}"
  vars:
    _rk2: "{{ reality_gen.stdout | from_json }}"
  when: three_x_ui_reality_private_key is not defined

- name: Stat persisted Reality short id
  ansible.builtin.stat:
    path: "{{ panel_dir }}/data/.balalaika-shortid.hex"
  register: shortid_stat

- name: Generate Reality short id (hex)
  ansible.builtin.command: openssl rand -hex 4
  register: shortid_gen
  changed_when: true
  when: not shortid_stat.stat.exists

- name: Persist Reality short id
  ansible.builtin.copy:
    dest: "{{ panel_dir }}/data/.balalaika-shortid.hex"
    content: "{{ shortid_gen.stdout | trim }}\n"
    mode: "0600"
  when: not shortid_stat.stat.exists

- name: Read Reality short id
  ansible.builtin.slurp:
    src: "{{ panel_dir }}/data/.balalaika-shortid.hex"
  register: shortid_slurp

- name: Build Reality shortIds list (empty + primary id)
  ansible.builtin.set_fact:
    three_x_ui_reality_short_ids: ["", "{{ shortid_slurp.content | b64decode | trim }}"]

- name: Reality keypair must be available
  ansible.builtin.assert:
    that:
      - three_x_ui_reality_private_key is defined
      - three_x_ui_reality_public_key is defined
      - three_x_ui_reality_private_key | length > 0
      - three_x_ui_reality_public_key | length > 0

- name: Build streamSettings for VLESS REALITY
  ansible.builtin.set_fact:
    three_x_ui_vless_stream:
      network: tcp
      security: reality
      externalProxy: []
      realitySettings:
        show: false
        xver: 0
        target: "{{ three_x_ui_reality_dest }}"
        serverNames: "{{ three_x_ui_reality_server_names }}"
        privateKey: "{{ three_x_ui_reality_private_key }}"
        minClientVer: ""
        maxClientVer: ""
        maxTimediff: 0
        shortIds: "{{ three_x_ui_reality_short_ids }}"
        mldsa65Seed: ""
        settings:
          publicKey: "{{ three_x_ui_reality_public_key }}"
          fingerprint: "{{ three_x_ui_reality_fingerprint }}"
          serverName: ""
          spiderX: /
          mldsa65Verify: ""
      tcpSettings:
        acceptProxyProtocol: false
        header:
          type: none

- name: Render managed inbound JSON for 3x-ui API
  ansible.builtin.template:
    src: three-x-ui-managed-inbound.json.j2
    dest: /tmp/balalaika-managed-inbound.json
    mode: "0600"

# Paths follow MHSanaei/3x-ui web/web.go: engine.Group(basePath), IndexController GET /csrf-token,
# APIController Group("/panel/api"). Prefix must match three_x_ui_web_base_path after x-ui setting + restart.
- name: Normalize web base path prefix for loopback URLs
  ansible.builtin.set_fact:
    xui_origin: "http://127.0.0.1:{{ three_x_ui_panel_port | int }}"
    xui_path_prefix: >-
      {{
        (
          three_x_ui_web_base_path | default('/panel/') | trim
          | regex_replace('^$', '/')
          | regex_replace('^([^/])', '/\\1')
        )
        | regex_replace('/$', '')
      }}

- name: Compose 3x-ui login and API paths
  ansible.builtin.set_fact:
    xui_csrf_url: "{{ xui_origin }}{{ xui_path_prefix }}/csrf-token"
    xui_login_post_url: "{{ xui_origin }}{{ xui_path_prefix }}/login"
    xui_api_root: "{{ xui_origin }}{{ xui_path_prefix }}/panel/api"

- name: Fetch CSRF token JSON (3x-ui SPA pre-login endpoint)
  ansible.builtin.uri:
    url: "{{ xui_csrf_url }}"
    method: GET
    headers:
      Accept: "application/json"
    return_content: true
    status_code: [200]
    timeout: 60
  register: xui_csrf_get

- name: Materialize CSRF string from JSON
  ansible.builtin.set_fact:
    xui_csrf: "{{ xui_csrf_get.json.obj | default('') }}"

- name: Require CSRF token
  ansible.builtin.assert:
    that:
      - xui_csrf | length > 0
      - xui_csrf_get.json.success | default(false) | bool
    fail_msg: >-
      CSRF bootstrap failed at {{ xui_csrf_url }} (check webBasePath matches nginx /panel/ and panel was restarted).

- name: Login to 3x-ui (session cookie)
  ansible.builtin.uri:
    url: "{{ xui_login_post_url }}"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ vpn_admin_username }}"
      password: "{{ vpn_admin_password }}"
    headers:
      X-CSRF-Token: "{{ xui_csrf }}"
      X-Requested-With: XMLHttpRequest
      Accept: "application/json"
    cookies: "{{ xui_csrf_get.cookies | default({}, true) }}"
    return_content: true
    status_code: [200]
    timeout: 60
  register: xui_login_post
  no_log: true

- name: Assert 3x-ui login JSON success
  ansible.builtin.assert:
    that:
      - xui_login_post.json.success | default(false) | bool

- name: Merge cookies for authenticated API calls
  ansible.builtin.set_fact:
    xui_cookies: >-
      {{
        (xui_csrf_get.cookies | default({}, true))
        | combine(xui_login_post.cookies | default({}, true))
      }}

- name: List inbounds from 3x-ui API
  ansible.builtin.uri:
    url: "{{ xui_api_root }}/inbounds/list"
    method: GET
    headers:
      X-CSRF-Token: "{{ xui_csrf }}"
      X-Requested-With: XMLHttpRequest
      Accept: "application/json"
    cookies: "{{ xui_cookies }}"
    return_content: true
    status_code: [200]
    timeout: 60
  register: xui_inbounds_list

- name: Assert inbounds list JSON success
  ansible.builtin.assert:
    that:
      - xui_inbounds_list.json.success | default(false) | bool

- name: Cache inbound rows
  ansible.builtin.set_fact:
    xui_inbound_rows: "{{ xui_inbounds_list.json.obj | default([]) }}"

- name: Fail when pinned THREE_X_UI_INBOUND_ID is missing on panel
  ansible.builtin.fail:
    msg: >-
      pinned inbound id {{ three_x_ui_inbound_id }} not found on panel
  when:
    - three_x_ui_inbound_id | length > 0
    - (three_x_ui_inbound_id | int) not in (xui_inbound_rows | map(attribute='id') | map('int') | list)

- name: Use pinned inbound id when configured and present
  ansible.builtin.set_fact:
    three_x_ui_inbound_for_app: "{{ three_x_ui_inbound_id }}"
  when:
    - three_x_ui_inbound_id | length > 0
    - (three_x_ui_inbound_id | int) in (xui_inbound_rows | map(attribute='id') | map('int') | list)

- name: Use existing inbound id matching managed remark
  ansible.builtin.set_fact:
    three_x_ui_inbound_for_app: "{{ item.id }}"
  loop: "{{ xui_inbound_rows }}"
  when:
    - three_x_ui_inbound_for_app is not defined
    - (item.remark | default('') | trim) == (three_x_ui_managed_inbound_remark | trim)

- name: Create managed inbound via API when not yet present
  when: three_x_ui_inbound_for_app is not defined
  block:
    - name: Load rendered inbound JSON from disk
      ansible.builtin.slurp:
        src: /tmp/balalaika-managed-inbound.json
      register: xui_managed_body_b64

    - name: POST /inbounds/add
      ansible.builtin.uri:
        url: "{{ xui_api_root }}/inbounds/add"
        method: POST
        body_format: json
        body: "{{ xui_managed_body_b64.content | b64decode | from_json }}"
        headers:
          X-CSRF-Token: "{{ xui_csrf }}"
          X-Requested-With: XMLHttpRequest
          Accept: "application/json"
        cookies: "{{ xui_cookies }}"
        return_content: true
        status_code: [200]
        timeout: 120
      register: xui_inbound_add

    - name: Assert inbound create JSON success
      ansible.builtin.assert:
        that:
          - xui_inbound_add.json.success | default(false) | bool
          - xui_inbound_add.json.obj.id is defined

    - name: Publish new inbound id for application template
      ansible.builtin.set_fact:
        three_x_ui_inbound_for_app: "{{ xui_inbound_add.json.obj.id }}"
