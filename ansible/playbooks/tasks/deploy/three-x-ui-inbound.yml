---
# Idempotent VLESS+REALITY inbound for the Telegram bot; sets three_x_ui_inbound_for_app.

- name: Assert Reality env overrides are paired
  ansible.builtin.assert:
    that:
      - >
        (three_x_ui_reality_private_key_override | length > 0)
        == (three_x_ui_reality_public_key_override | length > 0)
    fail_msg: >-
      Set both THREE_X_UI_REALITY_PRIVATE_KEY and THREE_X_UI_REALITY_PUBLIC_KEY in CI,
      or leave both empty to auto-generate on the server.

- name: Reality — apply keypair from secrets
  ansible.builtin.set_fact:
    three_x_ui_reality_private_key: "{{ three_x_ui_reality_private_key_override }}"
    three_x_ui_reality_public_key: "{{ three_x_ui_reality_public_key_override }}"
  when:
    - three_x_ui_reality_private_key_override | length > 0
    - three_x_ui_reality_public_key_override | length > 0

- name: Stat persisted Reality keypair on panel volume
  ansible.builtin.stat:
    path: "{{ panel_dir }}/data/.balalaika-reality.json"
  register: reality_stat

- name: Reality — load persisted keypair JSON
  ansible.builtin.slurp:
    src: "{{ panel_dir }}/data/.balalaika-reality.json"
  register: reality_slurp
  when:
    - three_x_ui_reality_private_key is not defined
    - reality_stat.stat.exists

- name: Reality — set keys from persisted JSON
  ansible.builtin.set_fact:
    three_x_ui_reality_private_key: "{{ _rk.privateKey }}"
    three_x_ui_reality_public_key: "{{ _rk.publicKey }}"
  vars:
    _rk: "{{ reality_slurp.content | b64decode | from_json }}"
  when:
    - three_x_ui_reality_private_key is not defined
    - reality_stat.stat.exists

- name: Reality — locate Xray binary inside 3x-ui container
  ansible.builtin.shell: |
    docker exec 3x-ui sh -c '
      for p in \
        /app/bin/xray-linux-amd64 \
        /app/bin/xray-linux-arm64 \
        /app/bin/xray-linux-arm32 \
        /app/bin/xray-linux-armv6 \
        /app/bin/xray; do
        if [ -x "$p" ]; then echo "$p"; exit 0; fi
      done
      f=$(find /app -maxdepth 8 -type f \( -name "xray-linux-*" -o -name xray \) -perm -111 2>/dev/null | head -n1)
      if [ -n "$f" ]; then echo "$f"; exit 0; fi
      exit 1
    '
  args:
    executable: /bin/bash
  register: three_x_ui_xray_bin
  changed_when: false
  failed_when: >
    (three_x_ui_xray_bin.rc | default(1) != 0) or
    ((three_x_ui_xray_bin.stdout | default('') | trim) | length == 0)
  when: three_x_ui_reality_private_key is not defined

- name: Reality — generate keypair via located Xray binary
  ansible.builtin.shell: |
    set -euo pipefail
    XRAY_X25519_OUT="$(docker exec 3x-ui "{{ three_x_ui_xray_bin.stdout | trim }}" x25519 2>&1)"
    export XRAY_X25519_OUT
    python3 <<'PY'
    import json
    import os
    import re
    import sys

    text = os.environ.get("XRAY_X25519_OUT", "")

    def grab(pat: str) -> str:
        m = re.search(pat, text)
        return m.group(1).strip() if m else ""

    priv = grab(r"PrivateKey:\s*(\S+)")
    pub = (
        grab(r"PublicKey:\s*(\S+)")
        or grab(r"Password\s*\(PublicKey\):\s*(\S+)")
        or grab(r"Password:\s*(\S+)")
    )
    if not priv or not pub:
        sys.stderr.write(
            "x25519: could not parse PrivateKey/PublicKey from:\\n" + repr(text[:500])
        )
        sys.exit(1)
    print(json.dumps({"privateKey": priv, "publicKey": pub}))
    PY
  args:
    executable: /bin/bash
  register: reality_gen
  changed_when: true
  when: three_x_ui_reality_private_key is not defined

- name: Reality — persist generated keypair on panel volume
  ansible.builtin.copy:
    dest: "{{ panel_dir }}/data/.balalaika-reality.json"
    content: "{{ reality_gen.stdout | trim }}\n"
    mode: "0600"
  when: three_x_ui_reality_private_key is not defined

- name: Reality — materialize generated keys as facts
  ansible.builtin.set_fact:
    three_x_ui_reality_private_key: "{{ _rk2.privateKey }}"
    three_x_ui_reality_public_key: "{{ _rk2.publicKey }}"
  vars:
    _rk2: "{{ reality_gen.stdout | from_json }}"
  when: three_x_ui_reality_private_key is not defined

- name: Stat persisted Reality short id
  ansible.builtin.stat:
    path: "{{ panel_dir }}/data/.balalaika-shortid.hex"
  register: shortid_stat

- name: Generate Reality short id (hex)
  ansible.builtin.command: openssl rand -hex 4
  register: shortid_gen
  changed_when: true
  when: not shortid_stat.stat.exists

- name: Persist Reality short id
  ansible.builtin.copy:
    dest: "{{ panel_dir }}/data/.balalaika-shortid.hex"
    content: "{{ shortid_gen.stdout | trim }}\n"
    mode: "0600"
  when: not shortid_stat.stat.exists

- name: Read Reality short id
  ansible.builtin.slurp:
    src: "{{ panel_dir }}/data/.balalaika-shortid.hex"
  register: shortid_slurp

- name: Build Reality shortIds list (empty + primary id)
  ansible.builtin.set_fact:
    three_x_ui_reality_short_ids: ["", "{{ shortid_slurp.content | b64decode | trim }}"]

- name: Reality keypair must be available
  ansible.builtin.assert:
    that:
      - three_x_ui_reality_private_key is defined
      - three_x_ui_reality_public_key is defined
      - three_x_ui_reality_private_key | length > 0
      - three_x_ui_reality_public_key | length > 0

- name: Build streamSettings for VLESS REALITY
  ansible.builtin.set_fact:
    three_x_ui_vless_stream:
      network: tcp
      security: reality
      tcpSettings:
        acceptProxyProtocol: false
        header:
          type: none
      realitySettings:
        show: false
        xver: 0
        dest: "{{ three_x_ui_reality_dest }}"
        serverNames: "{{ three_x_ui_reality_server_names }}"
        privateKey: "{{ three_x_ui_reality_private_key }}"
        minClientVer: ""
        maxClientVer: ""
        maxTimediff: 0
        shortIds: "{{ three_x_ui_reality_short_ids }}"
        settings:
          publicKey: "{{ three_x_ui_reality_public_key }}"
          fingerprint: "{{ three_x_ui_reality_fingerprint }}"
          serverName: "{{ three_x_ui_reality_server_names | first }}"
          spiderX: /

- name: Render managed inbound JSON for 3x-ui API
  ansible.builtin.template:
    src: three-x-ui-managed-inbound.json.j2
    dest: /tmp/balalaika-managed-inbound.json
    mode: "0600"

- name: Ensure managed VPN inbound exists (API)
  ansible.builtin.script: >-
    {{ playbook_dir }}/scripts/three_x_ui_ensure_inbound.py
    --host 127.0.0.1
    --panel-port {{ three_x_ui_panel_port | int }}
    --base-path {{ three_x_ui_web_base_path }}
    --username {{ vpn_admin_username | quote }}
    --remark {{ three_x_ui_managed_inbound_remark | quote }}
    {% if three_x_ui_inbound_id | length > 0 %}--pinned-id {{ three_x_ui_inbound_id | int }} {% endif %}
    --body-file /tmp/balalaika-managed-inbound.json
  environment:
    XUI_SCRIPT_PASSWORD: "{{ vpn_admin_password }}"
  register: inbound_ensure_script
  changed_when: true
  no_log: true

- name: Publish resolved inbound id for application template
  ansible.builtin.set_fact:
    three_x_ui_inbound_for_app: "{{ inbound_ensure_script.stdout | trim }}"
