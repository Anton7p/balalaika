---
- name: Ensure node directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ deploy_root }}"
    - "{{ node_dir }}"
    - "{{ node_var_dir }}"

- name: Read certificate from master hostvars
  ansible.builtin.set_fact:
    node_certificate_payload: "{{ hostvars[groups['master'][0]].marzban_node_certificate | default('') }}"
  no_log: true

- name: Validate certificate payload from master
  ansible.builtin.assert:
    that:
      - node_certificate_payload | length > 0
    fail_msg: "Node certificate is missing. Deploy master play first."
  no_log: true

- name: Write node certificate file
  ansible.builtin.copy:
    dest: "{{ cert_file }}"
    content: "{{ node_certificate_payload }}"
    owner: root
    group: root
    mode: "0644"
  no_log: true

- name: Ensure node API port is open in UFW
  ansible.builtin.command:
    cmd: ufw allow 62050/tcp
  register: ufw_node_port
  changed_when: "'Rule added' in ufw_node_port.stdout or 'Rules updated' in ufw_node_port.stdout"

- name: Deploy Marzban node compose file
  ansible.builtin.template:
    src: templates/marzban-node-compose.yml.j2
    dest: "{{ node_dir }}/docker-compose.yml"
    mode: "0644"

- name: Start/update Marzban node stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ node_dir }}"
  register: node_up
  changed_when: "'Started' in node_up.stdout or 'Recreated' in node_up.stdout or 'Creating' in node_up.stdout"

- name: Wait for node container to run
  ansible.builtin.command:
    cmd: docker ps -q -f name=marzban-node -f status=running
  register: node_running
  retries: 10
  delay: 3
  until: node_running.stdout | length > 0
  changed_when: false
