---
# Только значение из окружения; API панели Ansible не вызывает.

- name: Зафиксировать inbound id для .env бота
  ansible.builtin.set_fact:
    three_x_ui_inbound_for_app: "{{ three_x_ui_inbound_id }}"

- name: Проверка формата THREE_X_UI_INBOUND_ID
  ansible.builtin.assert:
    that:
      - three_x_ui_inbound_for_app is defined
      - three_x_ui_inbound_for_app | string | length > 0
      - three_x_ui_inbound_for_app | string is match('^[0-9]+$')
    fail_msg: >-
      Задайте THREE_X_UI_INBOUND_ID (положительное целое число — id inbound на панели 3x-ui).
