---
# Managed rule «Russia Bypass (Direct)»: geoip:ru + geosite:category-ru → outbound direct (всегда при деплое).
# Только Ansible/Jinja — без отдельных Python-файлов на хосте (см. docs/AGENT_INFRA.md).
# Cookie-only: login → POST panel/xray/ → POST panel/xray/update (form-urlencoded).

- name: Refresh 3x-ui session for Xray HTTP API
  ansible.builtin.include_tasks: three-x-ui-inbound/panel-login-session.yml

- name: Fetch full Xray template (POST panel/xray/)
  ansible.builtin.uri:
    url: "{{ xui_origin }}{{ xui_path_prefix }}/panel/xray/"
    method: POST
    headers:
      Host: "{{ xui_panel_http_host }}"
      Cookie: "{{ xui_cookie_header }}"
      X-Requested-With: XMLHttpRequest
      Accept: application/json
    return_content: true
    status_code: [200]
    timeout: 120
  register: xui_xray_get

- name: Assert Xray fetch succeeded
  ansible.builtin.assert:
    that:
      - xui_xray_get.json.success | default(false) | bool

- name: Normalize marker string for managed Russia Bypass rule
  ansible.builtin.set_fact:
    xui_ru_rule_mark: "Russia Bypass (Direct)"

- name: Parse panel Xray envelope (obj may be JSON string from API)
  ansible.builtin.set_fact:
    xui_xray_meta: >-
      {{
        (xui_xray_get.json.obj | from_json)
        if (xui_xray_get.json.obj is string)
        else xui_xray_get.json.obj
      }}

- name: Parse xraySetting JSON blob
  ansible.builtin.set_fact:
    xui_xray_cfg: >-
      {{
        (xui_xray_meta.xraySetting | from_json)
        if (xui_xray_meta.xraySetting is string)
        else xui_xray_meta.xraySetting
      }}

- name: Reset filtered routing.rules builder
  ansible.builtin.set_fact:
    xui_xray_rules_work: []

- name: Accumulate routing.rules without managed Russia Bypass remark
  ansible.builtin.set_fact:
    xui_xray_rules_work: "{{ xui_xray_rules_work + [ item ] }}"
  loop: "{{ xui_xray_cfg.routing.rules | default([]) }}"
  when: >-
    (not item is mapping)
    or (item['remarks'] | default('') != xui_ru_rule_mark)

- name: Definition managed Russia Bypass rule
  ansible.builtin.set_fact:
    xui_ru_bypass_rule:
      remarks: "{{ xui_ru_rule_mark }}"
      type: field
      domainMatcher: hybrid
      domain:
        - geosite:category-ru
      ip:
        - geoip:ru
      outboundTag: direct

- name: Reset Russia Bypass insert index (default head of rules list)
  ansible.builtin.set_fact:
    xui_ru_insert_idx: 0

- name: Prefer inserting after api inbound→api outbound rule when present
  ansible.builtin.set_fact:
    xui_ru_insert_idx: "{{ idx | int + 1 }}"
  loop: "{{ xui_xray_rules_work }}"
  loop_control:
    index_var: idx
  when:
    - item is mapping
    - item['outboundTag'] | default('') == 'api'
    - item['inboundTag'] | default([]) == ['api']

- name: Insert Russia Bypass rule into routing.rules
  ansible.builtin.set_fact:
    xui_xray_rules_new: >-
      {{
        xui_xray_rules_work[: xui_ru_insert_idx | int]
        + [ xui_ru_bypass_rule ]
        + xui_xray_rules_work[xui_ru_insert_idx | int :]
      }}

- name: Merge routing.rules back into Xray config (preserve routing.*)
  ansible.builtin.set_fact:
    xui_xray_cfg_merged: >-
      {{
        xui_xray_cfg | combine({
          'routing': (
            xui_xray_cfg.routing | default({}) | combine({'rules': xui_xray_rules_new})
          )
        })
      }}

- name: Serialize Xray template for panel form field
  ansible.builtin.set_fact:
    xui_xray_setting_json: "{{ xui_xray_cfg_merged | to_json }}"

- name: Resolve outbound test URL from panel snapshot
  ansible.builtin.set_fact:
    xui_outbound_test_url: "{{ xui_xray_meta.outboundTestUrl | default('https://www.google.com/generate_204', true) }}"

- name: Push merged Xray template (POST panel/xray/update)
  ansible.builtin.uri:
    url: "{{ xui_origin }}{{ xui_path_prefix }}/panel/xray/update"
    method: POST
    body_format: form-urlencoded
    body:
      xraySetting: "{{ xui_xray_setting_json }}"
      outboundTestUrl: "{{ xui_outbound_test_url }}"
    headers:
      Host: "{{ xui_panel_http_host }}"
      Cookie: "{{ xui_cookie_header }}"
      Accept: application/json
      X-Requested-With: XMLHttpRequest
    status_code: [200]
    timeout: 120
  register: xui_xray_update
  no_log: true

- name: Assert panel accepted Xray template update
  ansible.builtin.assert:
    that:
      - xui_xray_update.json.success | default(false) | bool
