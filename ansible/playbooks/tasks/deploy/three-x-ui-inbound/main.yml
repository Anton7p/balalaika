---
# Managed VLESS+REALITY inbound for the Telegram bot; sets three_x_ui_inbound_for_app.
# Steps are split into focused files under this directory.

- name: 3x-ui inbound — Reality keypair from CI secrets or persisted JSON on disk
  ansible.builtin.include_tasks: reality-keypair-load.yml

- name: 3x-ui inbound — Reality keypair generation when still missing
  ansible.builtin.include_tasks: reality-keypair-generate.yml

- name: 3x-ui inbound — Reality shortIds + verify keys present
  ansible.builtin.include_tasks: reality-short-id.yml

- name: 3x-ui inbound — VLESS streamSettings and rendered inbound JSON body
  ansible.builtin.include_tasks: vless-stream-and-managed-json.yml

- name: 3x-ui inbound — Panel HTTP login (loopback) and session cookie
  ansible.builtin.include_tasks: panel-login-session.yml

- name: 3x-ui inbound — List inbounds and validate pinned id if set
  ansible.builtin.include_tasks: panel-list-inbounds.yml

- name: 3x-ui inbound — Resolve remark or create managed inbound via API
  ansible.builtin.include_tasks: panel-ensure-managed-inbound.yml
