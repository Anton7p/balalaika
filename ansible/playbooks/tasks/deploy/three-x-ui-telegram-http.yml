---
# 3x-ui panel Telegram notifier: POST panel/setting/all → merge tg fields → POST panel/setting/update
# on loopback after POST login (session cookie). Requires panel listener up after compose + admin credential sync.

- name: Normalize loopback URL prefix for 3x-ui panel (same rules as inbound playbook)
  ansible.builtin.set_fact:
    xui_origin_tg: "http://127.0.0.1:{{ three_x_ui_panel_port | int }}"
    xui_path_prefix_tg: >-
      {{
        (
          three_x_ui_web_base_path | default('/panel/') | trim
          | regex_replace('^$', '/')
          | regex_replace('^([^/])', '/\\1')
        )
        | regex_replace('/$', '')
      }}

- name: Compose login and panel-setting URLs
  ansible.builtin.set_fact:
    xui_login_post_url_tg: "{{ xui_origin_tg }}{{ xui_path_prefix_tg }}/login"
    xui_setting_all_url_tg: "{{ xui_origin_tg }}{{ xui_path_prefix_tg }}/panel/setting/all"
    xui_setting_update_url_tg: "{{ xui_origin_tg }}{{ xui_path_prefix_tg }}/panel/setting/update"

- name: Login to 3x-ui for panel settings JSON API
  ansible.builtin.uri:
    url: "{{ xui_login_post_url_tg }}"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ vpn_admin_username }}"
      password: "{{ vpn_admin_password }}"
    headers:
      X-Requested-With: XMLHttpRequest
      Accept: application/json
    follow_redirects: all
    return_content: true
    status_code: [200]
    timeout: 60
  register: xui_login_tg
  no_log: true

- name: Assert 3x-ui login succeeded for Telegram settings sync
  ansible.builtin.assert:
    that:
      - xui_login_tg.json.success | default(false) | bool

- name: Build Cookie header for panel settings requests
  ansible.builtin.set_fact:
    xui_cookie_header_tg: >-
      {{
        xui_login_tg.cookies | default({}, true)
        | dictsort
        | map('join', '=')
        | join('; ')
      }}

- name: Require Cookie header after login
  ansible.builtin.assert:
    that:
      - xui_cookie_header_tg | length > 0

- name: Fetch full panel settings snapshot (POST setting/all)
  ansible.builtin.uri:
    url: "{{ xui_setting_all_url_tg }}"
    method: POST
    headers:
      Cookie: "{{ xui_cookie_header_tg }}"
      Accept: application/json
    return_content: true
    status_code: [200]
    timeout: 120
  register: xui_setting_all_tg

- name: Assert setting/all succeeded
  ansible.builtin.assert:
    that:
      - xui_setting_all_tg.json.success | default(false) | bool

- name: Decide Telegram-enabled flag from env/secrets
  ansible.builtin.set_fact:
    xui_tg_enable_wanted: >-
      {{
        ((telegram_bot_admin | default('', true)) | trim | length > 0)
        and ((telegram_admin_chat_id | default('', true)) | trim | length > 0)
      }}

- name: Merge Telegram-related keys into full settings object
  ansible.builtin.set_fact:
    xui_setting_update_body_tg: >-
      {{
        xui_setting_all_tg.json.obj | combine(
          {
            'tgBotEnable': (xui_tg_enable_wanted | bool),
            'tgBotToken': (
              (telegram_bot_admin | default('', true) | trim)
              if (xui_tg_enable_wanted | bool)
              else ''
            ),
            'tgBotChatId': (
              (telegram_admin_chat_id | default('', true) | trim)
              if (xui_tg_enable_wanted | bool)
              else ''
            ),
            'tgLang': (
              (three_x_ui_panel_tg_lang_enabled | default('ru-RU'))
              if (xui_tg_enable_wanted | bool)
              else (three_x_ui_panel_tg_lang_disabled | default('en-US'))
            ),
          }
        )
      }}

- name: Push merged settings (POST setting/update)
  ansible.builtin.uri:
    url: "{{ xui_setting_update_url_tg }}"
    method: POST
    body_format: json
    body: "{{ xui_setting_update_body_tg }}"
    headers:
      Cookie: "{{ xui_cookie_header_tg }}"
      Accept: application/json
    return_content: true
    status_code: [200]
    timeout: 120
  register: xui_setting_update_tg
  no_log: "{{ xui_tg_enable_wanted | bool }}"

- name: Assert panel accepted Telegram-related settings update
  ansible.builtin.assert:
    that:
      - xui_setting_update_tg.json.success | default(false) | bool

- name: Restart 3x-ui so built-in Telegram bot reloads settings
  ansible.builtin.command:
    cmd: docker compose restart 3x-ui
    chdir: "{{ panel_dir }}"

- name: Wait for 3x-ui web listener after Telegram HTTP sync restart
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ three_x_ui_panel_port | int }}"
    timeout: 180
    delay: 3
