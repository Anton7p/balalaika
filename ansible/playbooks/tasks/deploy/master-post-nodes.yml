---
- name: Authenticate to Marzban API after node deploy
  ansible.builtin.uri:
    url: "{{ marzban_api_url }}/admin/token"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ vpn_admin_username }}"
      password: "{{ vpn_admin_password }}"
    status_code: 200
    timeout: 15
  register: master_auth_post_nodes
  retries: 5
  delay: 3
  until: master_auth_post_nodes.status == 200
  no_log: true

- name: Fetch node certificate from Marzban after node deploy
  ansible.builtin.uri:
    url: "{{ marzban_api_url }}/node/settings"
    method: GET
    headers:
      Authorization: "Bearer {{ master_auth_post_nodes.json.access_token }}"
    status_code: 200
    return_content: true
    timeout: 30
  register: node_settings_post_nodes
  no_log: true

- name: Validate node certificate exists after node deploy
  ansible.builtin.assert:
    that:
      - node_settings_post_nodes.json.certificate is defined
      - node_settings_post_nodes.json.certificate | length > 0
    fail_msg: "Marzban API did not return node certificate from /node/settings."

- name: Build desired node address list from inventory
  ansible.builtin.set_fact:
    desired_node_addresses: "{{ (desired_node_addresses | default([])) + [hostvars[item].ansible_host | default(item)] }}"
  loop: "{{ groups['nodes'] | default([]) }}"
  when: groups['nodes'] is defined

- name: Ensure desired node address list exists
  ansible.builtin.set_fact:
    desired_node_addresses: "{{ desired_node_addresses | default([]) }}"

- name: Read current Marzban core config after node deploy
  ansible.builtin.uri:
    url: "{{ marzban_api_url }}/core/config"
    method: GET
    headers:
      Authorization: "Bearer {{ master_auth_post_nodes.json.access_token }}"
    status_code: 200
    return_content: true
    timeout: 30
  register: core_config_post_nodes
  no_log: true

- name: Keep only managed inbound by configured tag
  ansible.builtin.set_fact:
    managed_inbounds: >-
      {{
        (core_config_post_nodes.json.inbounds | default([]))
        | selectattr('tag', 'equalto', marzban_inbound_tag)
        | list
      }}

- name: Validate managed inbound exists before pruning
  ansible.builtin.assert:
    that:
      - managed_inbounds | length > 0
    fail_msg: "Managed inbound with configured MARZBAN_INBOUND_TAG was not found in Marzban core config."

- name: Build pruned core config with managed inbound only
  ansible.builtin.set_fact:
    pruned_core_config: "{{ core_config_post_nodes.json | combine({'inbounds': managed_inbounds}, recursive=True) }}"

- name: Apply pruned core config in Marzban
  ansible.builtin.uri:
    url: "{{ marzban_api_url }}/core/config"
    method: PUT
    headers:
      Authorization: "Bearer {{ master_auth_post_nodes.json.access_token }}"
      Content-Type: application/json
    body_format: json
    body: "{{ pruned_core_config }}"
    status_code: [200, 201, 204]
    timeout: 30

- name: Fetch existing registered nodes
  ansible.builtin.uri:
    url: "{{ marzban_api_url }}/nodes"
    method: GET
    headers:
      Authorization: "Bearer {{ master_auth_post_nodes.json.access_token }}"
    status_code: 200
    return_content: true
    timeout: 20
  register: existing_nodes_post_nodes
  no_log: true

- name: Remove stale nodes absent from inventory
  ansible.builtin.uri:
    url: "{{ marzban_api_url }}/node/{{ item.id }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ master_auth_post_nodes.json.access_token }}"
    status_code: [200, 204, 404]
    timeout: 20
  loop: "{{ existing_nodes_post_nodes.json | default([]) }}"
  loop_control:
    label: "{{ item.name | default(item.address) }}"
  when: item.address not in desired_node_addresses
  no_log: true

- name: Register missing infrastructure nodes in Marzban
  ansible.builtin.uri:
    url: "{{ marzban_api_url }}/node"
    method: POST
    headers:
      Authorization: "Bearer {{ master_auth_post_nodes.json.access_token }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "{{ item | replace('.', '-') }}"
      address: "{{ hostvars[item].ansible_host | default(item) }}"
      port: 62050
      api_prefix: "{{ (hostvars[item].ansible_host | default(item)) | hash('sha1') | regex_replace('^(.{8}).*$', '\\1') }}"
      certificate: "{{ node_settings_post_nodes.json.certificate }}"
    status_code: [200, 201, 409]
    timeout: 30
  loop: "{{ groups['nodes'] | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when: >
    groups['nodes'] is defined and
    (
      existing_nodes_post_nodes.json
      | selectattr('address', 'equalto', (hostvars[item].ansible_host | default(item)))
      | list
      | length
    ) == 0
  no_log: true

- name: Wait until each node reports connected in Marzban
  ansible.builtin.uri:
    url: "{{ marzban_api_url }}/nodes"
    method: GET
    headers:
      Authorization: "Bearer {{ master_auth_post_nodes.json.access_token }}"
    status_code: 200
    return_content: true
    timeout: 20
  register: nodes_connected_poll
  retries: 20
  delay: 6
  until: >
    (
      nodes_connected_poll.json
      | selectattr('address', 'equalto', (hostvars[item].ansible_host | default(item)))
      | map(attribute='status')
      | first
      | default('')
    ) == 'connected'
  loop: "{{ groups['nodes'] | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when: groups['nodes'] is defined
