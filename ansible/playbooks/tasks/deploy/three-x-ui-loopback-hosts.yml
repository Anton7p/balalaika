---
# ansible.builtin.uri builds the Host header from the URL host; setting Host in headers is ignored.
# 3x-ui may reject loopback calls when their Host is 127.0.0.1 vs configured domain — map domain → 127.0.0.1.

- name: Normalize hostname used for local panel HTTP requests
  ansible.builtin.set_fact:
    xui_panel_http_host: >-
      {{
        (
          (three_x_ui_loopback_http_host | default('', true) | trim)
          if (three_x_ui_loopback_http_host | default('', true) | trim | length) > 0
          else (
            domain_name | default('127.0.0.1', true) | trim
            | regex_replace('(?i)^https?://', '')
            | regex_replace('/.*$', '')
            | regex_replace(':[0-9]{1,5}$', '')
          )
        )
      }}

- name: Map panel hostname to loopback in /etc/hosts for URL-based Host header
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.0\.1\s+{{ xui_panel_http_host | regex_escape }}(\s|$)'
    line: "127.0.0.1 {{ xui_panel_http_host }}"
    state: present
    mode: "0644"
  when: xui_panel_http_host not in ['127.0.0.1', 'localhost']
