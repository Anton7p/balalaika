---
- name: Check panel compose file
  ansible.builtin.stat:
    path: "{{ xui_install_dir }}/docker-compose.yml"
  register: panel_compose_stat

- name: Stop panel stack and remove volumes
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ xui_install_dir }}/docker-compose.yml"
      - -p
      - "{{ xui_compose_project }}"
      - down
      - -v
      - --remove-orphans
    chdir: "{{ xui_install_dir }}"
  when: panel_compose_stat.stat.exists
  register: panel_compose_down
  changed_when: panel_compose_down.rc == 0

- name: Remove panel database directory
  ansible.builtin.file:
    path: "{{ xui_install_dir }}/db"
    state: absent
