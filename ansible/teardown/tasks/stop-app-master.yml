---
- name: Check app compose file
  ansible.builtin.stat:
    path: "{{ app_dir }}/docker-compose.yml"
  register: app_compose_stat

- name: Stop app stack and remove volumes (Postgres, Redis)
  ansible.builtin.command:
    cmd: docker compose down -v --remove-orphans
    chdir: "{{ app_dir }}"
  when: app_compose_stat.stat.exists
  register: app_compose_down
  changed_when: app_compose_down.rc == 0

- name: Remove app deploy directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: absent
