---
# 3x-ui (MHSanaei) — pinned image and paths (see docs/PANEL_MASTER_NODES.md).
xui_image: ghcr.io/mhsanaei/3x-ui:v3.0.2
xui_install_dir: /opt/infrastructure/panel
xui_container_name: xui_app
xui_compose_project: panel
xui_web_base_path: /panel/
# Base path master uses when calling node panel API (Nodes). Align with webBasePath on nodes (20-admin-cli).
xui_node_panel_base_path: "{{ xui_web_base_path }}"
xui_panel_http_port: 2053
xui_publish_host: 127.0.0.1
# Published Docker port on nodes (master uses 127.0.0.1 only).
xui_node_publish_host: "0.0.0.0"
xui_enable_fail2ban: "true"

# Создавать ли один «локальный» inbound на master (deploy-panel, порт xui_inbound_port).
# Если весь трафик только с нод — выставьте false и включите xui_create_per_node_inbounds.
xui_create_default_local_inbound: true

# По одному VLESS+REALITY inbound на каждую ноду на master с remark "{{ prefix }}-<ip-с-дефисами>" и nodeId.
# Порты: xui_per_node_inbound_port_base + индекс ноды (сортировка имён в inventory). На ноде UFW откроет этот порт.
xui_create_per_node_inbounds: true
xui_per_node_inbound_remark_prefix: balalaika-node
# Не пересекается с типичным xui_inbound_port 8443 на master (в БД панели порты inbound уникальны).
xui_per_node_inbound_port_base: 9443

# VLESS + REALITY inbound (matches app expectation: flow xtls-rprx-vision).
xui_inbound_port: 8443
xui_inbound_remark: balalaika-ansible-inbound
xui_reality_dest: www.yahoo.com:443
xui_reality_server_names:
  - www.yahoo.com

# User-Agent для UI-запросов с контроллера (CSRF → login → getApiToken). Переопределите, если WAF режет не-браузерные UA.
# xui_panel_http_user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

# Nginx: file to inject proxy locations (override if certbot used another vhost).
xui_nginx_site_path: /etc/nginx/sites-enabled/default

# Node panel (no TLS behind master by default).
xui_node_http_port: 2053
xui_node_scheme: http
