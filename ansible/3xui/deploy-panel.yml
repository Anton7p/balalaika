---
# Деплой панели 3x-ui на master: Docker, nginx, UFW, admin CLI, inbound через API.
- name: Deploy 3x-ui panel on master
  hosts: master
  become: true
  gather_facts: false
  vars_files:
    - defaults/main.yml
  vars:
    xui_domain_name: "{{ lookup('env', 'DOMAIN_NAME') | default('', true) | trim }}"
    xui_vpn_username: "{{ lookup('env', 'VPN_ADMIN_USERNAME') | default('', true) | trim }}"
    xui_vpn_password: "{{ lookup('env', 'VPN_ADMIN_PASSWORD') | default('', true) | trim }}"
    xui_telegram_admin_id: "{{ lookup('env', 'TELEGRAM_ADMIN_ID') | default('', true) | trim }}"
    xui_telegram_bot_admin: "{{ lookup('env', 'TELEGRAM_BOT_ADMIN') | default('', true) | trim }}"
    xui_telegram_panel_proxy: "{{ lookup('env', 'TELEGRAM_PANEL_SOCKS5_PROXY') | default('', true) | trim }}"
    xui_telegram_panel_api_server: "{{ lookup('env', 'TELEGRAM_PANEL_API_SERVER') | default('', true) | trim }}"
  pre_tasks:
    - name: Require DOMAIN_NAME and VPN admin secrets
      ansible.builtin.assert:
        that:
          - xui_domain_name | length > 0
          - xui_vpn_username | length > 0
          - xui_vpn_password | length > 0
        fail_msg: >-
          Set DOMAIN_NAME, VPN_ADMIN_USERNAME, VPN_ADMIN_PASSWORD in the environment
          (GitHub Actions secrets for deploy-3xui).

  tasks:
    - ansible.builtin.include_tasks: tasks/panel/10-compose.yml
    - ansible.builtin.include_tasks: tasks/panel/20-admin-cli.yml
    - ansible.builtin.include_tasks: tasks/panel/30-nginx.yml
    - ansible.builtin.include_tasks: tasks/panel/40-ufw-inbound.yml
      when: xui_create_default_local_inbound | default(true) | bool

# HTTPS API к панели — только с контроллера (WSL/CI), без sudo на localhost.
# Отдельный play: не смешивать с become на master. В inventory ssh/become
# задавайте в [master:vars]/[nodes:vars], не в [all:vars] — иначе synthetic localhost
# унаследует ansible_become и задачи на localhost попросят sudo.
- name: Configure panel inbound via public HTTPS API (controller)
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - defaults/main.yml
  vars:
    xui_domain_name: "{{ lookup('env', 'DOMAIN_NAME') | default('', true) | trim }}"
    xui_vpn_username: "{{ lookup('env', 'VPN_ADMIN_USERNAME') | default('', true) | trim }}"
    xui_vpn_password: "{{ lookup('env', 'VPN_ADMIN_PASSWORD') | default('', true) | trim }}"
    xui_telegram_admin_id: "{{ lookup('env', 'TELEGRAM_ADMIN_ID') | default('', true) | trim }}"
    xui_telegram_bot_admin: "{{ lookup('env', 'TELEGRAM_BOT_ADMIN') | default('', true) | trim }}"
    xui_telegram_panel_proxy: "{{ lookup('env', 'TELEGRAM_PANEL_SOCKS5_PROXY') | default('', true) | trim }}"
    xui_telegram_panel_api_server: "{{ lookup('env', 'TELEGRAM_PANEL_API_SERVER') | default('', true) | trim }}"
  tasks:
    - ansible.builtin.include_tasks: tasks/panel/22-telegram-settings.yml
    - ansible.builtin.include_tasks: tasks/panel/45-remove-local-inbound.yml
      when: not (xui_create_default_local_inbound | default(true) | bool)
    - ansible.builtin.include_tasks: tasks/panel/50-api-inbound.yml
      when: xui_create_default_local_inbound | default(true) | bool
