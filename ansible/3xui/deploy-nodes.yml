---
# Деплой 3x-ui на нодах и регистрация на master (API). Нужны inventory [nodes], DOMAIN_NAME, VPN_ADMIN_*.
- name: Require non-empty nodes inventory
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Assert [nodes] is present and non-empty
      ansible.builtin.assert:
        that:
          - (groups['nodes'] | default([])) | length > 0
        fail_msg: >-
          No hosts in group [nodes]. Export NODE_IPS (JSON array) and run ci/ci-write-inventory.yml
          to build inventory.ini, then run this playbook with -i inventory.ini.

- name: Install 3x-ui on each node
  hosts: nodes
  become: true
  gather_facts: false
  vars_files:
    - defaults/main.yml
  vars:
    xui_publish_host: "{{ xui_node_publish_host }}"
    xui_vpn_username: "{{ lookup('env', 'VPN_ADMIN_USERNAME') | default('', true) | trim }}"
    xui_vpn_password: "{{ lookup('env', 'VPN_ADMIN_PASSWORD') | default('', true) | trim }}"
  pre_tasks:
    - name: Require VPN admin secrets on nodes
      ansible.builtin.assert:
        that:
          - xui_vpn_username | length > 0
          - xui_vpn_password | length > 0
        fail_msg: Set VPN_ADMIN_USERNAME and VPN_ADMIN_PASSWORD in the environment.

  tasks:
    - ansible.builtin.include_tasks: tasks/nodes/10-compose.yml
    - ansible.builtin.include_tasks: tasks/nodes/20-admin-cli.yml
    - ansible.builtin.include_tasks: tasks/nodes/30-ufw.yml
    - ansible.builtin.include_tasks: tasks/nodes/40-node-token.yml

# Same network path as 3x-ui central panel → node (runtime/remote.go): Bearer + /panel/panel/api/…
- name: Verify node panel API from master host
  hosts: master
  gather_facts: false
  vars_files:
    - defaults/main.yml
  tasks:
    - name: GET inbounds/list on each node from master (Bearer must return 200)
      ansible.builtin.uri:
        url: >-
          {{ xui_node_scheme }}://{{ hostvars[item].ansible_host }}:{{ xui_node_http_port | int }}{{
            (xui_node_panel_base_path | default('/panel/') | trim | regex_replace('/$', ''))
          }}/panel/api/inbounds/list
        method: GET
        headers:
          Authorization: "Bearer {{ hostvars[item].xui_node_api_token }}"
          Accept: application/json
        status_code: 200
        timeout: 30
      loop: "{{ groups['nodes'] | sort }}"
      loop_control:
        label: "{{ item }}"
      register: xui_master_probe_node_api

- name: Register nodes on master panel
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - defaults/main.yml
  vars:
    xui_domain_name: "{{ lookup('env', 'DOMAIN_NAME') | default('', true) | trim }}"
    xui_vpn_username: "{{ lookup('env', 'VPN_ADMIN_USERNAME') | default('', true) | trim }}"
    xui_vpn_password: "{{ lookup('env', 'VPN_ADMIN_PASSWORD') | default('', true) | trim }}"
  pre_tasks:
    - ansible.builtin.include_tasks: ../tasks/resolve-app-namespace.yml

    - name: Require DOMAIN_NAME for master API URL
      ansible.builtin.assert:
        that:
          - xui_domain_name | length > 0
        fail_msg: Set DOMAIN_NAME (public master hostname used in https://…).

  tasks:
    - ansible.builtin.include_tasks: tasks/nodes/50-register-on-master.yml

- name: Open VPN inbound port on each node (per-node inbound from master)
  hosts: nodes
  become: true
  gather_facts: false
  vars_files:
    - defaults/main.yml
  tasks:
    - ansible.builtin.include_tasks: tasks/nodes/31-ufw-vpn-inbound.yml
      when:
        - xui_create_per_node_inbounds | default(false) | bool
        - (hostvars['localhost']['xui_node_vpn_port_map'] | default({})) | length > 0
    - ansible.builtin.include_tasks: tasks/nodes/32-compose-vpn-port-publish.yml
      when:
        - xui_create_per_node_inbounds | default(false) | bool
        - (hostvars['localhost']['xui_node_vpn_port_map'] | default({})) | length > 0
