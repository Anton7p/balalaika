---
# Ожидаются xui_master_origin, xui_master_bearer (play Register nodes, localhost).
- name: List inbounds on master (per-node reconcile)
  ansible.builtin.uri:
    url: "{{ xui_master_origin }}/panel/panel/api/inbounds/list"
    method: GET
    headers:
      Authorization: "Bearer {{ xui_master_bearer }}"
      Accept: application/json
    status_code: 200
    timeout: 90
  register: xui_ib_master_for_nodes_res
  no_log: true

- name: Assert master inbounds list succeeded
  ansible.builtin.assert:
    that:
      - xui_ib_master_for_nodes_res.json is defined
      - xui_ib_master_for_nodes_res.json.success | default(false)
      - xui_ib_master_for_nodes_res.json.obj is defined
    fail_msg: "master inbounds/list failed: {{ xui_ib_master_for_nodes_res.json.msg | default('unknown') }}"

- name: Refresh nodes on master after registration
  ansible.builtin.uri:
    url: "{{ xui_master_origin }}/panel/panel/api/nodes/list"
    method: GET
    headers:
      Authorization: "Bearer {{ xui_master_bearer }}"
      Accept: application/json
    status_code: 200
    timeout: 90
  register: xui_nodes_master_ref
  no_log: true

- name: Assert master nodes list succeeded
  ansible.builtin.assert:
    that:
      - xui_nodes_master_ref.json is defined
      - xui_nodes_master_ref.json.success | default(false)
      - xui_nodes_master_ref.json.obj is defined
    fail_msg: "master nodes/list failed: {{ xui_nodes_master_ref.json.msg | default('unknown') }}"

- name: Normalize master nodes list rows (probe + inbounds; obj may be JSON string)
  ansible.builtin.set_fact:
    xui_nodes_master_rows: >-
      {{
        (xui_nodes_master_ref.json.obj | from_json)
        if (xui_nodes_master_ref.json.obj is string)
        else (xui_nodes_master_ref.json.obj | default([]) | list)
      }}

- name: Build name -> master node id map (for probe + per-node inbounds)
  ansible.builtin.set_fact:
    xui_master_name_to_node_id: >-
      {{
        dict(
          (xui_nodes_master_rows | default([])
           | map(attribute='name')
           | map('string')
           | list)
          | zip(xui_nodes_master_rows | default([]) | map(attribute='id') | list)
          | list
        )
      }}

- name: Build address -> master node id map (fallback)
  ansible.builtin.set_fact:
    xui_master_addr_to_node_id: >-
      {{
        dict(
          (xui_nodes_master_rows | default([])
           | map(attribute='address')
           | map('string')
           | list)
          | zip(xui_nodes_master_rows | default([]) | map(attribute='id') | list)
          | list
        )
      }}

# Heartbeat/probe can lag right after registration; give jobs a moment then force probe.
- name: Brief pause before node health probe (heartbeat job interval)
  ansible.builtin.pause:
    seconds: 15

- name: Probe each inventory node on master (refresh status before inbounds/add)
  ansible.builtin.uri:
    url: "{{ xui_master_origin }}/panel/panel/api/nodes/probe/{{ xui_probe_node_id }}"
    method: POST
    headers:
      Authorization: "Bearer {{ xui_master_bearer }}"
      Accept: application/json
      Content-Type: application/json
    body_format: json
    body: {}
    status_code: 200
    timeout: 90
  vars:
    xui_probe_node_name: "node-{{ hostvars[item].ansible_host | replace('.', '-') }}"
    xui_probe_addr: "{{ hostvars[item].ansible_host | string }}"
    xui_probe_node_id: >-
      {{
        (
          (xui_master_name_to_node_id | default({}))[xui_probe_node_name]
          | default((xui_master_addr_to_node_id | default({}))[xui_probe_addr])
          | default('')
        )
        | string
      }}
  loop: "{{ groups['nodes'] | sort | list }}"
  when: (xui_probe_node_id | string | trim | length) > 0
  register: xui_probe_nodes_batch
  failed_when: false
  changed_when: false
  no_log: true

- name: Stable node iteration order (inventory hostnames sorted)
  ansible.builtin.set_fact:
    xui_nodes_sorted: "{{ groups['nodes'] | sort | list }}"

- name: Reset VPN port map for UFW on nodes
  ansible.builtin.set_fact:
    xui_node_vpn_port_map: {}

- name: Reconcile one VLESS+REALITY inbound per node on master
  ansible.builtin.include_tasks: tasks/nodes/53-one-per-node-inbound.yml
  loop: "{{ xui_nodes_sorted }}"
  loop_control:
    loop_var: xui_pnm_inv_host
    index_var: xui_node_ord_idx
    label: "{{ xui_pnm_inv_host }}"
