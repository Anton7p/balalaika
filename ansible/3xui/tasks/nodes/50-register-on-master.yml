---
- name: Build JSON payload for master node registration
  ansible.builtin.set_fact:
    xui_nodes_register: "{{ xui_nodes_register | default([]) + [ node_row ] }}"
  vars:
    node_row:
      name: "node-{{ hostvars[item].ansible_host | replace('.', '-') }}"
      address: "{{ hostvars[item].ansible_host }}"
      apiToken: "{{ hostvars[item].xui_node_api_token }}"
      scheme: "{{ xui_node_scheme }}"
      port: "{{ xui_node_http_port | int }}"
      basePath: "{{ xui_node_panel_base_path }}"
      remark: ansible-node
  loop: "{{ groups['nodes'] }}"

- name: Set master panel HTTPS origin
  ansible.builtin.set_fact:
    xui_master_origin: "https://{{ xui_domain_name | trim }}"

- name: Obtain master panel API bearer via UI login
  ansible.builtin.include_tasks: tasks/include-panel-ui-session-bearer.yml
  vars:
    xui_panel_origin: "{{ xui_master_origin }}"
    xui_panel_auth_label: "master HTTPS panel"

- name: Set master bearer for nodes API
  ansible.builtin.set_fact:
    xui_master_bearer: "{{ xui_ui_session_bearer }}"
  no_log: true

- name: List existing nodes on master panel
  ansible.builtin.uri:
    url: "{{ xui_master_origin }}/panel/panel/api/nodes/list"
    method: GET
    headers:
      Authorization: "Bearer {{ xui_master_bearer }}"
      Accept: application/json
    status_code: 200
    timeout: 90
  register: xui_nodes_list_res
  no_log: true

- name: Assert nodes list from master
  ansible.builtin.assert:
    that:
      - xui_nodes_list_res.json is defined
      - xui_nodes_list_res.json.success | default(false)
      - xui_nodes_list_res.json.obj is defined
    fail_msg: "master nodes/list failed: {{ xui_nodes_list_res.json.msg | default('unknown') }}"

- name: Register or update each node on master panel
  ansible.builtin.include_tasks: tasks/nodes/51-register-one-node-on-master.yml
  loop: "{{ xui_nodes_register }}"
  loop_control:
    loop_var: sync_node
    label: "{{ sync_node.name }} {{ sync_node.address }}"
