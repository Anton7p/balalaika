---
# Play vars vs vars_files merge can leave xui_publish_host at panel default (127.0.0.1);
# master must reach the node API over the network — always bind like defaults/xui_node_publish_host.
- name: Set Docker publish host for node panel
  ansible.builtin.set_fact:
    xui_publish_host: "{{ xui_node_publish_host | default('0.0.0.0') | trim }}"

# Same formula as per-node inbound on master (sorted inventory index).
- name: Derive planned VPN publish port for this node
  ansible.builtin.set_fact:
    xui_node_vpn_publish_port: "{{ xui_per_node_inbound_port_base | int + ((groups['nodes'] | sort).index(inventory_hostname) | int) }}"

- name: Ensure panel install directory exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ xui_install_dir }}"
    - "{{ xui_install_dir }}/db"

- name: Install docker compose file for 3x-ui (node)
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ xui_install_dir }}/docker-compose.yml"
    mode: "0644"

- name: Pull and start 3x-ui stack on node
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ xui_install_dir }}/docker-compose.yml"
      - -p
      - "{{ xui_compose_project }}"
      - up
      - -d
      - --pull
      - always
    chdir: "{{ xui_install_dir }}"
  register: xui_node_compose_up
  changed_when: true

- name: Wait for panel HTTP port on node
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ xui_panel_http_port }}"
    timeout: 120
