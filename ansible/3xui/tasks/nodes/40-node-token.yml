---
# Токен API ноды: UI-сессия — tasks/include-panel-ui-session-bearer.yml; Cookie — templates/common/cookie_header.j2.
- name: Set loopback origin for node panel API
  ansible.builtin.set_fact:
    xui_node_local_origin: "http://127.0.0.1:{{ xui_panel_http_port }}"

- name: Obtain panel API token via UI login (node loopback)
  ansible.builtin.include_tasks: tasks/include-panel-ui-session-bearer.yml
  vars:
    xui_panel_origin: "{{ xui_node_local_origin }}"
    xui_panel_auth_label: "node loopback panel"

- name: Save node API token as host fact
  ansible.builtin.set_fact:
    xui_node_api_token: "{{ xui_ui_session_bearer }}"
    cacheable: false
  no_log: true
