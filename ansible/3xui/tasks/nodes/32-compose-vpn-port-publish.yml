---
# After master inbound reconcile: publish actual VPN port in Docker (watchdog TCP + clients).
- name: Read VPN port for this node from master reconcile map
  ansible.builtin.set_fact:
    xui_node_vpn_publish_port: "{{ hostvars['localhost']['xui_node_vpn_port_map'][inventory_hostname] | int }}"

- name: Install docker compose file with VPN port published
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ xui_install_dir }}/docker-compose.yml"
    mode: "0644"

- name: Recreate stack so Docker publishes VPN port
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ xui_install_dir }}/docker-compose.yml"
      - -p
      - "{{ xui_compose_project }}"
      - up
      - -d
    chdir: "{{ xui_install_dir }}"
  register: xui_node_compose_vpn_up
  changed_when: true

- name: Wait for VPN port on node (host loopback)
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ xui_node_vpn_publish_port }}"
    timeout: 180
    delay: 5
