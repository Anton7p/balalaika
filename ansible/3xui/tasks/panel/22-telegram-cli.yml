---
- name: Load Telegram settings for 3x-ui panel from environment
  ansible.builtin.set_fact:
    xui_telegram_bot_token: "{{ lookup('env', 'TELEGRAM_BOT_ADMIN') | default('', true) | trim }}"
    xui_telegram_admin_id: "{{ lookup('env', 'TELEGRAM_ADMIN_ID') | default('', true) | trim }}"

- name: Apply Telegram bot token and admin chat ID (panel notifications)
  when:
    - xui_telegram_bot_token | length > 0
    - xui_telegram_admin_id | length > 0
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ xui_container_name }}"
      - /app/x-ui
      - setting
      - -tgbottoken
      - "{{ xui_telegram_bot_token }}"
      - -tgbotchatid
      - "{{ xui_telegram_admin_id }}"
      - -enabletgbot
  register: xui_telegram_cli
  changed_when: xui_telegram_cli.rc == 0
  failed_when: xui_telegram_cli.rc != 0
  no_log: true

- name: Restart panel container after Telegram settings
  when:
    - xui_telegram_bot_token | length > 0
    - xui_telegram_admin_id | length > 0
  ansible.builtin.command:
    argv:
      - docker
      - restart
      - "{{ xui_container_name }}"
  changed_when: true

- name: Wait for panel HTTP port after Telegram restart
  when:
    - xui_telegram_bot_token | length > 0
    - xui_telegram_admin_id | length > 0
  ansible.builtin.wait_for:
    host: "{{ xui_publish_host }}"
    port: "{{ xui_panel_http_port }}"
    timeout: 120
