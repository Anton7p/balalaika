---
- name: Apply admin username, password, and webBasePath via x-ui CLI
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ xui_container_name }}"
      - /app/x-ui
      - setting
      - -username
      - "{{ xui_vpn_username }}"
      - -password
      - "{{ xui_vpn_password }}"
      - -webBasePath
      - "{{ xui_web_base_path }}"
  register: xui_setting_cli
  changed_when: xui_setting_cli.rc == 0
  failed_when: xui_setting_cli.rc != 0

- name: Restart panel container after credential change
  ansible.builtin.command:
    argv:
      - docker
      - restart
      - "{{ xui_container_name }}"
  changed_when: true

- name: Wait for panel HTTP port after restart
  ansible.builtin.wait_for:
    host: "{{ xui_publish_host }}"
    port: "{{ xui_panel_http_port }}"
    timeout: 120
