---
- name: Ensure panel install directory exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ xui_install_dir }}"
    - "{{ xui_install_dir }}/db"

- name: Install docker compose file for 3x-ui
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ xui_install_dir }}/docker-compose.yml"
    mode: "0644"

- name: Pull and start 3x-ui stack
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ xui_install_dir }}/docker-compose.yml"
      - -p
      - "{{ xui_compose_project }}"
      - up
      - -d
      - --pull
      - always
    chdir: "{{ xui_install_dir }}"
  register: xui_compose_up
  changed_when: true

- name: Wait for panel HTTP port
  ansible.builtin.wait_for:
    host: "{{ xui_publish_host }}"
    port: "{{ xui_panel_http_port }}"
    timeout: 120
