---
# Публичный HTTPS origin панели (localhost play на контроллере).
- name: Set panel public HTTPS origin
  ansible.builtin.set_fact:
    xui_panel_public_origin: "https://{{ xui_domain_name | trim }}"

- name: Obtain panel API bearer via UI login (public URL)
  ansible.builtin.include_tasks: tasks/include-panel-ui-session-bearer.yml
  vars:
    xui_panel_origin: "{{ xui_panel_public_origin }}"
    xui_panel_auth_label: "master public panel (inbound API)"

- name: List inbounds on panel (Bearer)
  ansible.builtin.uri:
    url: "{{ xui_panel_public_origin }}/panel/panel/api/inbounds/list"
    method: GET
    headers:
      Authorization: "Bearer {{ xui_ui_session_bearer }}"
      Accept: application/json
    status_code: 200
    timeout: 90
  register: xui_ib_list_res
  no_log: true

- name: Assert inbounds list succeeded
  ansible.builtin.assert:
    that:
      - xui_ib_list_res.json is defined
      - xui_ib_list_res.json.success | default(false)
    fail_msg: "inbounds/list failed: {{ xui_ib_list_res.json.msg | default('unknown') }}"

- name: Count inbounds with target remark (idempotence)
  ansible.builtin.set_fact:
    xui_inbound_matching: "{{ xui_ib_list_res.json.obj | default([]) | selectattr('remark', 'defined') | selectattr('remark', 'equalto', xui_inbound_remark) | list | length }}"

- name: Generate Reality shortId (16 hex chars on controller)
  when: (xui_inbound_matching | int) == 0
  block:
    - name: Prefer python3, else openssl (Linux/macOS/WSL)
      ansible.builtin.shell: |
        set -eu
        if command -v python3 >/dev/null 2>&1; then
          python3 -c "import secrets; print(secrets.token_hex(8))"
        elif command -v openssl >/dev/null 2>&1; then
          openssl rand -hex 8
        else
          exit 47
        fi
      args:
        executable: /bin/bash
      register: xui_short_id_cmd
      changed_when: false

    - name: Set shortId from shell output
      ansible.builtin.set_fact:
        xui_reality_short_id_hex: "{{ xui_short_id_cmd.stdout | trim }}"

  rescue:
    - name: Fallback shortId (Ansible password lookup, no python3/openssl)
      ansible.builtin.set_fact:
        xui_reality_short_id_hex: "{{ lookup('password', '/dev/null', length=16, chars='0123456789abcdef') }}"

- name: Assert Reality shortId is 16 hex chars
  ansible.builtin.assert:
    that:
      - xui_reality_short_id_hex is defined
      - (xui_reality_short_id_hex | string | length) == 16
      - (xui_reality_short_id_hex | string | lower) is match('^[0-9a-f]{16}$')
    fail_msg: >-
      Could not build 16-char hex Reality shortId on controller.
      Install python3 or openssl, or run Ansible from WSL/Linux (see docs/AGENT_INFRA.md).
  when: (xui_inbound_matching | int) == 0

- name: Fetch new X25519 cert for Reality (Bearer)
  ansible.builtin.uri:
    url: "{{ xui_panel_public_origin }}/panel/panel/api/server/getNewX25519Cert"
    method: GET
    headers:
      Authorization: "Bearer {{ xui_ui_session_bearer }}"
      Accept: application/json
    status_code: 200
    timeout: 90
  register: xui_newcert_res
  no_log: true
  when: (xui_inbound_matching | int) == 0

- name: Assert getNewX25519Cert succeeded
  ansible.builtin.assert:
    that:
      - xui_newcert_res.json is defined
      - xui_newcert_res.json.success | default(false)
      - xui_newcert_res.json.obj is defined
    fail_msg: "getNewX25519Cert failed: {{ xui_newcert_res.json.msg | default('unknown') }}"
  when: (xui_inbound_matching | int) == 0

- name: Parse getNewX25519Cert payload (obj may be JSON string or object)
  ansible.builtin.set_fact:
    xui_cert_obj: "{{ xui_newcert_res.json.obj | from_json if (xui_newcert_res.json.obj is string) else xui_newcert_res.json.obj }}"
  when: (xui_inbound_matching | int) == 0

- name: Assert new X25519 cert contains privateKey and publicKey
  ansible.builtin.assert:
    that:
      - xui_cert_obj.privateKey is defined
      - (xui_cert_obj.privateKey | string | length) > 0
      - xui_cert_obj.publicKey is defined
      - (xui_cert_obj.publicKey | string | length) > 0
    fail_msg: getNewX25519Cert returned incomplete Reality keypair
  when: (xui_inbound_matching | int) == 0

- name: Build streamSettings JSON string for VLESS+REALITY
  ansible.builtin.set_fact:
    xui_stream_settings_str: "{{ xui_stream_inner | to_json }}"
  vars:
    xui_stream_inner:
      network: tcp
      security: reality
      realitySettings:
        show: false
        xver: 0
        dest: "{{ xui_reality_dest }}"
        serverNames: "{{ xui_reality_server_names }}"
        privateKey: "{{ xui_cert_obj.privateKey }}"
        publicKey: "{{ xui_cert_obj.publicKey }}"
        minClientVer: ""
        maxClientVer: ""
        maxTimediff: 0
        shortIds:
          - "{{ xui_reality_short_id_hex }}"
  when: (xui_inbound_matching | int) == 0

- name: Create VLESS+REALITY inbound on panel (Bearer)
  ansible.builtin.uri:
    url: "{{ xui_panel_public_origin }}/panel/panel/api/inbounds/add"
    method: POST
    headers:
      Authorization: "Bearer {{ xui_ui_session_bearer }}"
      Accept: application/json
    body_format: json
    body:
      up: 0
      down: 0
      total: 0
      remark: "{{ xui_inbound_remark }}"
      enable: true
      expiryTime: 0
      listen: ""
      port: "{{ xui_inbound_port | int }}"
      protocol: vless
      settings: "{{ {'clients': [], 'decryption': 'none', 'fallbacks': []} | to_json }}"
      streamSettings: "{{ xui_stream_settings_str }}"
      tag: ""
      sniffing: "{{ {'enabled': true, 'destOverride': ['http', 'tls', 'quic'], 'metadataOnly': false} | to_json }}"
    status_code: 200
    timeout: 90
  register: xui_inb_create_res
  no_log: true
  failed_when:
    - not (xui_inb_create_res.skipped | default(false) | bool)
    - xui_inb_create_res.json is defined
    - not (xui_inb_create_res.json.success | default(false))
  when: (xui_inbound_matching | int) == 0
