---
# Build ansible/inventory.ini on the CI runner from env vars (GitHub Actions secrets).
# No shell/Python helpers — only Ansible + Jinja.
#
# Env:
#   MASTER_IP — JSON object {"address","password"} (both required, non-empty)
#   NODE_IPS — optional JSON array [{"address","password"}, ...]; иначе [nodes] пустой
#   OUTPUT_PATH — optional absolute path; default ../inventory.ini (ansible root)

- name: Materialize inventory.ini for CI
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ci_inventory_dest: >-
      {{ (lookup('env', 'OUTPUT_PATH', default='') | trim | length > 0)
         | ternary(lookup('env', 'OUTPUT_PATH') | trim,
                   playbook_dir | dirname ~ '/inventory.ini') }}

  tasks:
    # Native Jinja coerces JSON-shaped env values to dict; keep a real string for .startswith / from_json.
    - name: Read MASTER_IP from environment
      ansible.builtin.set_fact:
        _ci_master_raw: "{{ lookup('env', 'MASTER_IP', default='') | trim | string }}"

    - name: Require MASTER_IP
      ansible.builtin.assert:
        that:
          - _ci_master_raw | length > 0
        fail_msg: MASTER_IP is empty

    - name: Require MASTER_IP JSON object
      ansible.builtin.assert:
        that:
          - _ci_master_raw.startswith('{')
        fail_msg: >-
          MASTER_IP must be JSON with required keys address and password,
          e.g. {"address":"203.0.113.10","password":"your-root-password"}

    - name: Parse MASTER_IP JSON
      ansible.builtin.set_fact:
        _ci_json: "{{ _ci_master_raw | from_json }}"

    - name: Require MASTER_IP JSON mapping
      ansible.builtin.assert:
        that:
          - _ci_json is mapping
        fail_msg: MASTER_IP must be a JSON object (not an array or bare string)

    - name: Extract address and password from MASTER_IP
      ansible.builtin.set_fact:
        _ci_host_candidate: "{{ _ci_json.address | default('', true) | trim }}"
        _ci_master_password: "{{ _ci_json.password | default('', true) | trim }}"

    - name: Require non-empty address and password in MASTER_IP
      ansible.builtin.assert:
        that:
          - _ci_host_candidate | length > 0
          - _ci_master_password | length > 0
        fail_msg: MASTER_IP JSON must include non-empty address and password

    - name: Normalize host candidate (scheme, quotes)
      ansible.builtin.set_fact:
        _n: >-
          {{
            _ci_host_candidate
            | regex_replace('(?i)^https?://', '')
            | regex_replace('[\"' ~ "'" ~ ']', '')
            | trim
          }}

    - name: Strip leading/trailing slashes from host candidate
      ansible.builtin.set_fact:
        _n: >-
          {{
            _n
            | regex_replace('^/+', '')
            | regex_replace('/+$', '')
            | trim
          }}

    # Нельзя делить по всем «:» — IPv4 вида 203.0.113.10 превратится в «203». Снимаем только суффикс :порт.
    - name: Drop trailing TCP port suffix (:digits)
      ansible.builtin.set_fact:
        _n: "{{ _n | regex_replace(':[0-9]{1,5}$', '') | trim }}"

    # IPv4 раньше «общего» паттерна: класс [._-] в середине [A-Za-z0-9._-] даёт неочевидные диапазоны в regex.
    - name: Resolve parseable master host (IPv4, hostname, or first sane token)
      ansible.builtin.set_fact:
        ci_master_host: >-
          {% if _n | regex_search('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$') %}
          {{ _n }}
          {% elif _n is match('^[-0-9A-Za-z_.]+$') %}
          {{ _n }}
          {% elif _n | regex_search('(?:[0-9]{1,3}\.){3}[0-9]{1,3}') %}
          {{ _n | regex_search('(?:[0-9]{1,3}\.){3}[0-9]{1,3}') }}
          {% else %}
          {{ _n | regex_search('[-0-9A-Za-z_.]+') | default('', true) }}
          {% endif %}

    - name: Normalize resolved master host whitespace
      ansible.builtin.set_fact:
        ci_master_host: "{{ ci_master_host | trim }}"

    - name: Validate resolved MASTER_IP
      ansible.builtin.assert:
        that:
          - ci_master_host | length > 0
          - ci_master_host is match('^[-0-9A-Za-z_.]+$')
        fail_msg: MASTER_IP is not parseable

    - name: Alias master password for template
      ansible.builtin.set_fact:
        ci_master_password: "{{ _ci_master_password | default('') }}"

    - name: Read NODE_IPS from environment
      ansible.builtin.set_fact:
        _node_ips_raw: "{{ lookup('env', 'NODE_IPS', default='') | trim | string }}"

    - name: Inventory nodes list empty when NODE_IPS unset
      ansible.builtin.set_fact:
        ci_inventory_nodes: []
      when: _node_ips_raw | length == 0

    - name: Parse NODE_IPS JSON
      ansible.builtin.set_fact:
        _node_ips_list: "{{ _node_ips_raw | from_json }}"
      when: _node_ips_raw | length > 0

    - name: Require NODE_IPS to be a JSON array
      ansible.builtin.assert:
        that:
          - _node_ips_list is sequence
          - _node_ips_list is not string
          - _node_ips_list is not mapping
        fail_msg: >-
          NODE_IPS must be a JSON array of objects,
          e.g. [{"address":"10.0.0.2","password":"root-pass"}]
      when: _node_ips_raw | length > 0

    - name: Init nodes list before normalization loop
      ansible.builtin.set_fact:
        ci_inventory_nodes: []
      when: _node_ips_raw | length > 0

    - name: Normalize each NODE_IPS entry
      ansible.builtin.include_tasks: normalize-node-entry.yml
      loop: "{{ _node_ips_list }}"
      loop_control:
        label: "{{ item.address | default('?') }}"
      when: _node_ips_raw | length > 0

    - name: Write inventory.ini
      ansible.builtin.template:
        src: inventory.ci.ini.j2
        dest: "{{ ci_inventory_dest }}"
        mode: "0644"
