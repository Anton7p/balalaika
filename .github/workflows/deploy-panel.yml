name: Deploy Panel Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-panel:
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
      VPN_ADMIN_USERNAME: ${{ secrets.VPN_ADMIN_USERNAME }}
      VPN_ADMIN_PASSWORD: ${{ secrets.VPN_ADMIN_PASSWORD }}
      THREE_X_UI_INBOUND_ID: ${{ secrets.THREE_X_UI_INBOUND_ID }}
      THREE_X_UI_VPN_PORT: ${{ secrets.THREE_X_UI_VPN_PORT }}
      THREE_X_UI_REALITY_PRIVATE_KEY: ${{ secrets.THREE_X_UI_REALITY_PRIVATE_KEY }}
      THREE_X_UI_REALITY_PUBLIC_KEY: ${{ secrets.THREE_X_UI_REALITY_PUBLIC_KEY }}
      THREE_X_UI_MANAGED_INBOUND_REMARK: ${{ secrets.THREE_X_UI_MANAGED_INBOUND_REMARK }}
      THREE_X_UI_WEB_BASE_PATH: ${{ secrets.THREE_X_UI_WEB_BASE_PATH }}
      THREE_X_UI_PANEL_PORT: ${{ secrets.THREE_X_UI_PANEL_PORT }}
      THREE_X_UI_SUB_PORT: ${{ secrets.THREE_X_UI_SUB_PORT }}
      THREE_X_UI_IMAGE: ${{ secrets.THREE_X_UI_IMAGE }}
      TELEGRAM_BOT_ADMIN: ${{ secrets.TELEGRAM_BOT_ADMIN }}
      TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          for var in SERVER_IP SSH_PRIVATE_KEY DOMAIN_NAME VPN_ADMIN_USERNAME VPN_ADMIN_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret: $var"
              exit 1
            fi
          done

      - name: Install Ansible and sshpass
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "ansible>=9.0.0"
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Write Ansible inventory (master only)
        working-directory: ansible
        run: ansible-playbook -i localhost, playbooks/ci-write-inventory.yml

      - name: Prepare SSH private key
        shell: bash
        run: |
          mkdir -p .tmp-keys
          printf '%s\n' "$SSH_PRIVATE_KEY" > .tmp-keys/id_rsa
          chmod 600 .tmp-keys/id_rsa

      - name: Verify SSH connectivity
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible master -i inventory.ini -m ping --private-key ../.tmp-keys/id_rsa

      - name: Preflight syntax check
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          VPN_ADMIN_USERNAME: ${{ secrets.VPN_ADMIN_USERNAME }}
          VPN_ADMIN_PASSWORD: ${{ secrets.VPN_ADMIN_PASSWORD }}
          THREE_X_UI_INBOUND_ID: ${{ secrets.THREE_X_UI_INBOUND_ID }}
          THREE_X_UI_VPN_PORT: ${{ secrets.THREE_X_UI_VPN_PORT }}
          THREE_X_UI_REALITY_PRIVATE_KEY: ${{ secrets.THREE_X_UI_REALITY_PRIVATE_KEY }}
          THREE_X_UI_REALITY_PUBLIC_KEY: ${{ secrets.THREE_X_UI_REALITY_PUBLIC_KEY }}
          THREE_X_UI_MANAGED_INBOUND_REMARK: ${{ secrets.THREE_X_UI_MANAGED_INBOUND_REMARK }}
          THREE_X_UI_WEB_BASE_PATH: ${{ secrets.THREE_X_UI_WEB_BASE_PATH }}
          THREE_X_UI_PANEL_PORT: ${{ secrets.THREE_X_UI_PANEL_PORT }}
          THREE_X_UI_SUB_PORT: ${{ secrets.THREE_X_UI_SUB_PORT }}
          THREE_X_UI_IMAGE: ${{ secrets.THREE_X_UI_IMAGE }}
          TELEGRAM_BOT_ADMIN: ${{ secrets.TELEGRAM_BOT_ADMIN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          ansible-playbook -i inventory.ini playbooks/deploy-panel.yml --syntax-check

      - name: Run panel playbook
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          VPN_ADMIN_USERNAME: ${{ secrets.VPN_ADMIN_USERNAME }}
          VPN_ADMIN_PASSWORD: ${{ secrets.VPN_ADMIN_PASSWORD }}
          THREE_X_UI_INBOUND_ID: ${{ secrets.THREE_X_UI_INBOUND_ID }}
          THREE_X_UI_VPN_PORT: ${{ secrets.THREE_X_UI_VPN_PORT }}
          THREE_X_UI_REALITY_PRIVATE_KEY: ${{ secrets.THREE_X_UI_REALITY_PRIVATE_KEY }}
          THREE_X_UI_REALITY_PUBLIC_KEY: ${{ secrets.THREE_X_UI_REALITY_PUBLIC_KEY }}
          THREE_X_UI_MANAGED_INBOUND_REMARK: ${{ secrets.THREE_X_UI_MANAGED_INBOUND_REMARK }}
          THREE_X_UI_WEB_BASE_PATH: ${{ secrets.THREE_X_UI_WEB_BASE_PATH }}
          THREE_X_UI_PANEL_PORT: ${{ secrets.THREE_X_UI_PANEL_PORT }}
          THREE_X_UI_SUB_PORT: ${{ secrets.THREE_X_UI_SUB_PORT }}
          THREE_X_UI_IMAGE: ${{ secrets.THREE_X_UI_IMAGE }}
          TELEGRAM_BOT_ADMIN: ${{ secrets.TELEGRAM_BOT_ADMIN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          ansible-playbook -i inventory.ini playbooks/deploy-panel.yml --private-key ../.tmp-keys/id_rsa

      - name: Verify 3x-ui container on master
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible master -i inventory.ini -a "docker ps --filter name=3x-ui --format '{{\"{{.Names}}\"}}'" --private-key ../.tmp-keys/id_rsa

      - name: Cleanup temporary key material
        if: always()
        run: rm -rf .tmp-keys
