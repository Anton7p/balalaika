name: Reset and redeploy all

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  reset-and-redeploy:
    runs-on: ubuntu-latest
    env:
      MASTER_IP: ${{ secrets.MASTER_IP }}
      NODE_IPS: ${{ secrets.NODE_IPS }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
      VPN_ADMIN_USERNAME: ${{ secrets.VPN_ADMIN_USERNAME }}
      VPN_ADMIN_PASSWORD: ${{ secrets.VPN_ADMIN_PASSWORD }}
      TELEGRAM_BOT_ADMIN: ${{ secrets.TELEGRAM_BOT_ADMIN }}
      TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible, sshpass, Ansible collections
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "ansible>=9.0.0"
          sudo apt-get update
          sudo apt-get install -y sshpass
          ansible-galaxy collection install ansible.posix community.general

      - name: Write Ansible inventory (master + nodes)
        working-directory: ansible
        run: ansible-playbook -i localhost, ci/ci-write-inventory.yml

      - name: Prepare SSH private key
        shell: bash
        run: |
          mkdir -p .tmp-keys
          printf '%s\n' "$SSH_PRIVATE_KEY" > .tmp-keys/id_rsa
          chmod 600 .tmp-keys/id_rsa

      - name: Verify SSH to master and nodes
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible master -i inventory.ini -m ping --private-key ../.tmp-keys/id_rsa
          ansible nodes -i inventory.ini -m ping --private-key ../.tmp-keys/id_rsa

      - name: Teardown — stop containers and wipe panel/app data
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory.ini teardown/reset-infrastructure.yml --private-key ../.tmp-keys/id_rsa

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror 3x-ui image to org GHCR
        id: mirror_xui
        env:
          XUI_TAG: v3.0.2
        run: |
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          upstream="ghcr.io/mhsanaei/3x-ui:${XUI_TAG}"
          mirrored="ghcr.io/${owner_lc}/3x-ui:${XUI_TAG}"
          echo "mirrored=${mirrored}" >> "$GITHUB_OUTPUT"
          docker pull "${upstream}"
          docker tag "${upstream}" "${mirrored}"
          docker push "${mirrored}"

      - name: Deploy 3x-ui panel on master
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          XUI_IMAGE: ${{ steps.mirror_xui.outputs.mirrored }}
        run: |
          ansible-playbook -i inventory.ini 3xui/deploy-panel.yml --private-key ../.tmp-keys/id_rsa

      - name: Deploy 3x-ui nodes and register on master
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          XUI_IMAGE: ${{ steps.mirror_xui.outputs.mirrored }}
        run: |
          ansible-playbook -i inventory.ini 3xui/deploy-nodes.yml --private-key ../.tmp-keys/id_rsa

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute lowercase image repository
        id: image_meta
        shell: bash
        run: |
          repo_lc="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "repo_lc=$repo_lc" >> "$GITHUB_OUTPUT"
          echo "app_image=ghcr.io/$repo_lc:deploy-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image_meta.outputs.app_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy bot application on master
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          APP_IMAGE: ${{ steps.image_meta.outputs.app_image }}
        run: |
          ansible-playbook -i inventory.ini bot/deploy-app.yml --private-key ../.tmp-keys/id_rsa

      - name: Cleanup temporary key material
        if: always()
        run: rm -rf .tmp-keys
