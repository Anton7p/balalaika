name: Bootstrap Infrastructure

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      MASTER_IP: ${{ secrets.MASTER_IP }}
      NODE_IPS: ${{ secrets.NODE_IPS }}
      DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ANSIBLE_SSH_USERNAME: root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible and sshpass
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "ansible>=9.0.0"
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Validate required secrets
        shell: bash
        run: |
          for var in MASTER_IP DOMAIN_NAME SSH_PUBLIC_KEY SSH_PRIVATE_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret: $var"
              exit 1
            fi
          done

      - name: Build Ansible inventory from secrets
        working-directory: ansible
        run: ansible-playbook -i localhost, ci/ci-write-inventory.yml

      - name: Prepare runtime SSH key files for Ansible
        shell: bash
        run: |
          mkdir -p .tmp-keys
          printf '%s\n' "$SSH_PRIVATE_KEY" > .tmp-keys/id_rsa
          printf '%s\n' "$SSH_PUBLIC_KEY" > .tmp-keys/id_rsa.pub
          chmod 600 .tmp-keys/id_rsa
          chmod 644 .tmp-keys/id_rsa.pub

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install ansible.posix community.general

      - name: Run bootstrap playbook (key first, password fallback)
        working-directory: ansible
        env:
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory.ini bootstrap/bootstrap.yml --private-key ../.tmp-keys/id_rsa

      - name: Verify key-based SSH access after bootstrap
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible master -i inventory.ini -m ping --private-key ../.tmp-keys/id_rsa

      - name: Cleanup temporary key material
        if: always()
        run: rm -rf .tmp-keys
