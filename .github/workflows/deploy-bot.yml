name: Deploy Bot Only

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy-bot:
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
      VPN_ADMIN_USERNAME: ${{ secrets.VPN_ADMIN_USERNAME }}
      VPN_ADMIN_PASSWORD: ${{ secrets.VPN_ADMIN_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image repository
        id: image_meta
        shell: bash
        run: |
          repo_lc="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "repo_lc=$repo_lc" >> "$GITHUB_OUTPUT"
          echo "app_image=ghcr.io/$repo_lc:deploy-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image_meta.outputs.app_image }}

      - name: Install Ansible and sshpass
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "ansible>=9.0.0"
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Write Ansible inventory
        working-directory: ansible
        run: ansible-playbook -i localhost, ci/ci-write-inventory.yml

      - name: Prepare SSH private key
        shell: bash
        run: |
          mkdir -p .tmp-keys
          printf '%s\n' "$SSH_PRIVATE_KEY" > .tmp-keys/id_rsa
          chmod 600 .tmp-keys/id_rsa

      - name: Verify SSH connectivity
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible master -i inventory.ini -m ping --private-key ../.tmp-keys/id_rsa

      - name: Preflight syntax check
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          VPN_ADMIN_USERNAME: ${{ secrets.VPN_ADMIN_USERNAME }}
          VPN_ADMIN_PASSWORD: ${{ secrets.VPN_ADMIN_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          APP_IMAGE: ${{ steps.image_meta.outputs.app_image }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
        run: |
          ansible-playbook -i inventory.ini bot/deploy-app.yml --syntax-check

      - name: Run bot-only playbook
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          VPN_ADMIN_USERNAME: ${{ secrets.VPN_ADMIN_USERNAME }}
          VPN_ADMIN_PASSWORD: ${{ secrets.VPN_ADMIN_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          APP_IMAGE: ${{ steps.image_meta.outputs.app_image }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
        run: |
          ansible-playbook -i inventory.ini bot/deploy-app.yml --private-key ../.tmp-keys/id_rsa

      - name: Cleanup temporary key material
        if: always()
        run: rm -rf .tmp-keys
