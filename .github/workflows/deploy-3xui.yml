name: Deploy 3x-ui

on:
  workflow_dispatch:
    inputs:
      target:
        description: panel — только панель на master; nodes — только ноды; all — панель, затем ноды
        required: true
        type: choice
        default: all
        options:
          - panel
          - nodes
          - all

permissions:
  contents: read

jobs:
  deploy-3xui:
    runs-on: ubuntu-latest
    env:
      MASTER_IP: ${{ secrets.MASTER_IP }}
      NODE_IPS: ${{ secrets.NODE_IPS }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
      VPN_ADMIN_USERNAME: ${{ secrets.VPN_ADMIN_USERNAME }}
      VPN_ADMIN_PASSWORD: ${{ secrets.VPN_ADMIN_PASSWORD }}
      TELEGRAM_BOT_ADMIN: ${{ secrets.TELEGRAM_BOT_ADMIN }}
      TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible, sshpass, Ansible collections
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "ansible>=9.0.0"
          sudo apt-get update
          sudo apt-get install -y sshpass
          ansible-galaxy collection install ansible.posix community.general

      - name: Write Ansible inventory (master + nodes)
        working-directory: ansible
        run: ansible-playbook -i localhost, ci/ci-write-inventory.yml

      - name: Prepare SSH private key
        shell: bash
        run: |
          mkdir -p .tmp-keys
          printf '%s\n' "$SSH_PRIVATE_KEY" > .tmp-keys/id_rsa
          chmod 600 .tmp-keys/id_rsa

      - name: Verify SSH to master
        if: ${{ inputs.target == 'panel' || inputs.target == 'all' }}
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible master -i inventory.ini -m ping --private-key ../.tmp-keys/id_rsa

      - name: Detect node lines in inventory
        id: nodes_inv
        working-directory: ansible
        run: |
          if grep -qE '^node[0-9]+ ' inventory.ini; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail when target=nodes but inventory has no nodes
        if: ${{ inputs.target == 'nodes' && steps.nodes_inv.outputs.present != 'true' }}
        run: |
          echo "NODE_IPS is empty or invalid — inventory has no [nodes] hosts." >&2
          exit 1

      - name: Verify SSH to nodes
        if: ${{ (inputs.target == 'nodes' || inputs.target == 'all') && steps.nodes_inv.outputs.present == 'true' }}
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible nodes -i inventory.ini -m ping --private-key ../.tmp-keys/id_rsa

      - name: Syntax check — panel playbook
        if: ${{ inputs.target == 'panel' || inputs.target == 'all' }}
        working-directory: ansible
        run: ansible-playbook -i inventory.ini 3xui/deploy-panel.yml --syntax-check

      - name: Deploy 3x-ui panel on master
        if: ${{ inputs.target == 'panel' || inputs.target == 'all' }}
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory.ini 3xui/deploy-panel.yml --private-key ../.tmp-keys/id_rsa

      - name: Syntax check — nodes playbook
        if: ${{ (inputs.target == 'nodes' || inputs.target == 'all') && steps.nodes_inv.outputs.present == 'true' }}
        working-directory: ansible
        run: ansible-playbook -i inventory.ini 3xui/deploy-nodes.yml --syntax-check

      - name: Deploy 3x-ui nodes and register on master
        if: ${{ (inputs.target == 'nodes' || inputs.target == 'all') && steps.nodes_inv.outputs.present == 'true' }}
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory.ini 3xui/deploy-nodes.yml --private-key ../.tmp-keys/id_rsa

      - name: Cleanup temporary key material
        if: always()
        run: rm -rf .tmp-keys
