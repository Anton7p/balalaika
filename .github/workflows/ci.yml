name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Prisma schema validate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_CI || 'postgresql://ci:ci@localhost:5432/ci?schema=public' }}
        run: npx prisma validate
      - name: Build
        run: npm run build
